name: Build

# Cross-platform VCV Rack plugin builds via the per-platform Rack SDK.
# Each job downloads the matching SDK, runs `make -C vcv dist` (which packages
# a .vcvplugin), and uploads it as an artifact. On a version tag (e.g. v2.0.1)
# the release job attaches all five platform bundles to a GitHub Release.
#
# NOTE: this builds the VCV plugin only. The MetaModule .mmplugin needs the
# arm-none-eabi cross-toolchain + metamodule-plugin-sdk and is built locally
# (see metamodule/CMakeLists.txt) — not wired into CI here.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # Pin to the Rack release you target. See https://vcvrack.com/downloads
  # (the SDK zip is Rack-SDK-<version>-<platform>.zip).
  RACK_SDK_VERSION: "2.5.2"

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: lin-x64,   os: ubuntu-latest, sdk: lin-x64 }
          # macos-14 runners are Apple Silicon. The Rack SDK's arch.mk picks
          # the plugin's compile target from `$(CC) -dumpmachine` (the build
          # host), not from which SDK zip was downloaded — so even against
          # the "universal" mac-x64+arm64 SDK, a plain build only produces an
          # arm64 plugin.dylib. Get x64 by cross-compiling explicitly via
          # CROSS_COMPILE; Apple clang can target x86_64 from an arm64 host
          # without a separate toolchain. Two single-arch mac assets ship
          # (there's no plugin.mk support for packaging a fat/universal
          # .vcvplugin), same coverage as one universal build.
          - { name: mac-arm64, os: macos-14,      sdk: mac-x64+arm64 }
          - { name: mac-x64,   os: macos-14,      sdk: mac-x64+arm64, cross: x86_64-apple-darwin }
          - { name: win-x64,   os: windows-latest, sdk: win-x64 }
    steps:
      - uses: actions/checkout@v4

      # Windows builds run under MSYS2 / MinGW-w64, the toolchain the Rack SDK
      # expects on Windows.
      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # jq is needed by the Rack SDK's `dist` target (reads plugin.json);
          # Linux/macOS runners ship it, the MSYS2 env does not.
          install: mingw-w64-x86_64-gcc make zip unzip curl jq

      - name: Build .vcvplugin (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CROSS_COMPILE: ${{ matrix.cross }}
        run: |
          set -euo pipefail
          curl -fL "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${{ matrix.sdk }}.zip" -o rack-sdk.zip
          unzip -q rack-sdk.zip
          if [ -n "$CROSS_COMPILE" ]; then
            make -C vcv dist RACK_DIR="$PWD/Rack-SDK" CROSS_COMPILE="$CROSS_COMPILE"
          else
            make -C vcv dist RACK_DIR="$PWD/Rack-SDK"
          fi

      - name: Build .vcvplugin (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          curl -fL "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${{ matrix.sdk }}.zip" -o rack-sdk.zip
          unzip -q rack-sdk.zip
          make -C vcv dist RACK_DIR="$PWD/Rack-SDK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobotBoy-${{ matrix.name }}
          path: vcv/dist/*.vcvplugin
          if-no-files-found: error

  # On a version tag, gather every platform bundle and attach them to the
  # GitHub Release for that tag.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.vcvplugin
          generate_release_notes: true
          fail_on_unmatched_files: true
