PatchData:
  patch_name: RB-Onbetap-2
  description: 'Onbetap Vintage: detuned stereo saws, seeded L/R cutoff drift, slow LFO on cutoff'
  module_slugs:
    0: '4msCompany:HubMedium'
    1: 'RobotBoy:Onbetap'
    2: 'Fundamental:VCO'
    3: 'Fundamental:VCO'
    4: 'Bogaudio:Bogaudio-LLFO'
  int_cables:
    - out: {module_id: 2, jack_id: 2}
      ins:
        - {module_id: 1, jack_id: 0}
    - out: {module_id: 3, jack_id: 2}
      ins:
        - {module_id: 1, jack_id: 1}
    - out: {module_id: 4, jack_id: 0}
      ins:
        - {module_id: 1, jack_id: 2}
  mapped_ins:
    - panel_jack_id: 0
      alias_name: Pad Pitch
      ins:
        - {module_id: 2, jack_id: 0}
        - {module_id: 3, jack_id: 0}
    - panel_jack_id: 1
      alias_name: Q CV
      ins:
        - {module_id: 1, jack_id: 3}
  mapped_outs:
    - panel_jack_id: 0
      alias_name: Audio L
      out: {module_id: 1, jack_id: 0}
    - panel_jack_id: 1
      alias_name: Audio R
      out: {module_id: 1, jack_id: 1}
  static_knobs:
    - {module_id: 1, param_id: 0, value: 0.5247}
    - {module_id: 1, param_id: 1, value: 0.5}
    - {module_id: 1, param_id: 2, value: 0.3}
    - {module_id: 1, param_id: 3, value: 0.0}
    - {module_id: 1, param_id: 4, value: 0.65}
    - {module_id: 1, param_id: 5, value: 1.0}
    - {module_id: 1, param_id: 6, value: 1.0}
    - {module_id: 2, param_id: 1, value: 1.0}
    - {module_id: 2, param_id: 2, value: 0.38889}
    - {module_id: 2, param_id: 4, value: 0.5}
    - {module_id: 2, param_id: 5, value: 0.5}
    - {module_id: 2, param_id: 6, value: 0.5}
    - {module_id: 2, param_id: 7, value: 0.0}
    - {module_id: 3, param_id: 1, value: 1.0}
    - {module_id: 3, param_id: 2, value: 0.38954}
    - {module_id: 3, param_id: 4, value: 0.5}
    - {module_id: 3, param_id: 5, value: 0.5}
    - {module_id: 3, param_id: 6, value: 0.5}
    - {module_id: 3, param_id: 7, value: 0.0}
    - {module_id: 4, param_id: 0, value: 0.35744}
    - {module_id: 4, param_id: 1, value: 1.0}
    - {module_id: 4, param_id: 2, value: 0.0}
    - {module_id: 4, param_id: 3, value: 0.5}
    - {module_id: 4, param_id: 4, value: 0.3}
  mapped_knobs:
    - name: Knob Set 1
      set:
        - {panel_knob_id: 0, module_id: 1, param_id: 0, curve_type: 0, min: 0, max: 1, alias_name: Cutoff}
        - {panel_knob_id: 1, module_id: 1, param_id: 1, curve_type: 0, min: 0, max: 1, alias_name: Q}
        - {panel_knob_id: 2, module_id: 1, param_id: 2, curve_type: 0, min: 0, max: 1, alias_name: Drive}
        - {panel_knob_id: 3, module_id: 1, param_id: 3, curve_type: 0, min: 0, max: 1, alias_name: Mode}
        - {panel_knob_id: 4, module_id: 1, param_id: 4, curve_type: 0, min: 0, max: 1, alias_name: Cutoff CV Amt}
        - {panel_knob_id: 5, module_id: 1, param_id: 5, curve_type: 0, min: 0, max: 1, alias_name: Q CV Amt}
  vcvModuleStates:
    - module_id: 1
      data: |-
        {"vintageDrift":true,"oversample":1}
