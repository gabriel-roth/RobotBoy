PatchData:
  patch_name: RB-MF20-2
  description: 'MF-20 Korg35 mode: same layout as RB-MF20-1 for A/B; raspier resonance, buzzier drive'
  module_slugs:
    0: '4msCompany:HubMedium'
    1: 'RobotBoy:MF20Filter'
    2: 'Fundamental:VCO'
  int_cables:
    - out: {module_id: 2, jack_id: 2}
      ins:
        - {module_id: 1, jack_id: 0}
  mapped_ins:
    - panel_jack_id: 0
      alias_name: LP Cutoff CV
      ins:
        - {module_id: 1, jack_id: 2}
    - panel_jack_id: 1
      alias_name: Total Cutoff CV
      ins:
        - {module_id: 1, jack_id: 4}
    - panel_jack_id: 2
      alias_name: VCO Pitch
      ins:
        - {module_id: 2, jack_id: 0}
    - panel_jack_id: 3
      alias_name: HP Cutoff CV
      ins:
        - {module_id: 1, jack_id: 3}
  mapped_outs:
    - panel_jack_id: 0
      alias_name: Audio L
      out: {module_id: 1, jack_id: 0}
    - panel_jack_id: 1
      alias_name: Audio R
      out: {module_id: 1, jack_id: 1}
  static_knobs:
    - {module_id: 1, param_id: 0, value: 0.2915}
    - {module_id: 1, param_id: 1, value: 0.7}
    - {module_id: 1, param_id: 2, value: 0.0}
    - {module_id: 1, param_id: 3, value: 0.25}
    - {module_id: 1, param_id: 4, value: 0.0}
    - {module_id: 1, param_id: 5, value: 1.0}
    - {module_id: 1, param_id: 6, value: 1.0}
    - {module_id: 1, param_id: 7, value: 1.0}
    - {module_id: 2, param_id: 1, value: 1.0}
    - {module_id: 2, param_id: 2, value: 0.27778}
    - {module_id: 2, param_id: 4, value: 0.5}
    - {module_id: 2, param_id: 5, value: 0.5}
    - {module_id: 2, param_id: 6, value: 0.5}
    - {module_id: 2, param_id: 7, value: 0.0}
  mapped_knobs:
    - name: Knob Set 1
      set:
        - {panel_knob_id: 0, module_id: 1, param_id: 0, curve_type: 0, min: 0, max: 1, alias_name: LP Cutoff}
        - {panel_knob_id: 1, module_id: 1, param_id: 1, curve_type: 0, min: 0, max: 1, alias_name: LP Peak}
        - {panel_knob_id: 2, module_id: 1, param_id: 2, curve_type: 0, min: 0, max: 1, alias_name: HP Cutoff}
        - {panel_knob_id: 3, module_id: 1, param_id: 3, curve_type: 0, min: 0, max: 1, alias_name: HP Peak}
        - {panel_knob_id: 4, module_id: 1, param_id: 4, curve_type: 0, min: 0, max: 1, alias_name: Drive}
        - {panel_knob_id: 5, module_id: 1, param_id: 5, curve_type: 0, min: 0, max: 1, alias_name: LP CV Amt}
        - {panel_knob_id: 6, module_id: 1, param_id: 7, curve_type: 0, min: 0, max: 1, alias_name: Total CV Amt}
        - {panel_knob_id: 7, module_id: 1, param_id: 6, curve_type: 0, min: 0, max: 1, alias_name: HP CV Amt}
  vcvModuleStates:
    - module_id: 1
      data: |-
        {"_filterMode":1}
