PatchData:
  patch_name: RB-Vespid-1
  description: 'British Wasp CMOS rasp: square wave in via VCA, Mix on Out 1/2, BP/HP/LP taps on Outs 3/4/5'
  module_slugs:
    0: '4msCompany:HubMedium'
    1: 'RobotBoy:Vespid'
    2: 'Fundamental:VCO'
    3: 'Fundamental:VCA-1'
  int_cables:
    - out: {module_id: 2, jack_id: 3}
      ins:
        - {module_id: 3, jack_id: 1}
    - out: {module_id: 3, jack_id: 0}
      ins:
        - {module_id: 1, jack_id: 0}
  mapped_ins:
    - panel_jack_id: 0
      alias_name: Freq CV
      ins:
        - {module_id: 1, jack_id: 2}
    - panel_jack_id: 1
      alias_name: Blend CV
      ins:
        - {module_id: 1, jack_id: 5}
    - panel_jack_id: 2
      alias_name: Res CV
      ins:
        - {module_id: 1, jack_id: 3}
    - panel_jack_id: 3
      alias_name: VCO pitch
      ins:
        - {module_id: 2, jack_id: 0}
  mapped_outs:
    - panel_jack_id: 0
      alias_name: Mix L
      out: {module_id: 1, jack_id: 0}
    - panel_jack_id: 1
      alias_name: Mix R
      out: {module_id: 1, jack_id: 1}
    - panel_jack_id: 2
      alias_name: BP L
      out: {module_id: 1, jack_id: 4}
    - panel_jack_id: 3
      alias_name: HP L
      out: {module_id: 1, jack_id: 2}
    - panel_jack_id: 4
      alias_name: LP L
      out: {module_id: 1, jack_id: 6}
  static_knobs:
    - {module_id: 1, param_id: 0, value: 0.392}
    - {module_id: 1, param_id: 1, value: 0.6}
    - {module_id: 1, param_id: 2, value: 0.4}
    - {module_id: 1, param_id: 3, value: 0.5}
    - {module_id: 1, param_id: 4, value: 1.0}
    - {module_id: 1, param_id: 5, value: 1.0}
    - {module_id: 1, param_id: 6, value: 1.0}
    - {module_id: 2, param_id: 1, value: 1.0}
    - {module_id: 2, param_id: 2, value: 0.27778}
    - {module_id: 2, param_id: 4, value: 0.5}
    - {module_id: 2, param_id: 5, value: 0.5}
    - {module_id: 2, param_id: 6, value: 0.5}
    - {module_id: 2, param_id: 7, value: 0.0}
    - {module_id: 3, param_id: 0, value: 1.0}
    - {module_id: 3, param_id: 1, value: 1.0}
  mapped_knobs:
    - name: Knob Set 1
      set:
        - {panel_knob_id: 0, module_id: 1, param_id: 0, curve_type: 0, min: 0, max: 1, alias_name: Freq}
        - {panel_knob_id: 1, module_id: 1, param_id: 1, curve_type: 0, min: 0, max: 1, alias_name: Res}
        - {panel_knob_id: 2, module_id: 1, param_id: 2, curve_type: 0, min: 0, max: 1, alias_name: Drive}
        - {panel_knob_id: 3, module_id: 1, param_id: 3, curve_type: 0, min: 0, max: 1, alias_name: Blend}
        - {panel_knob_id: 4, module_id: 1, param_id: 4, curve_type: 0, min: 0, max: 1, alias_name: Freq CV amt}
        - {panel_knob_id: 5, module_id: 1, param_id: 5, curve_type: 0, min: 0, max: 1, alias_name: Res CV amt}
        - {panel_knob_id: 6, module_id: 1, param_id: 6, curve_type: 0, min: 0, max: 1, alias_name: Drive CV amt}
        - {panel_knob_id: 7, module_id: 3, param_id: 0, curve_type: 0, min: 0, max: 1, alias_name: Input level}
  vcvModuleStates:
    - module_id: 1
      data: |-
        {"german":false,"panelTheme":0,"oscPitchCorrected":false}
