PatchData:
  patch_name: demo_freeze_slice3
  description: >-
    Echos freeze-slicer demo, TIME=0.4285714 (slice 3). DENSITY=4/11 -> 0.5 s base
    time on the 4 s HiFi buffer -> 8 slices. Input: demo_freeze_in.wav
    (eight 0.5 s tone segments 200..900 Hz on ch0; freeze gate on ch1 rises
    at t=4.0 s into the FREEZE jack, jack_id 9). BLEND=1 (wet only),
    FEEDBACK=0. Frozen slice 3 = 2.0-2.5 s of the recording -> expect a looping
    600 Hz tone from t=4.0 s on (slice k starts at (3.5 - 0.5k) s, i.e.
    900 - 100k Hz). The headless sim can't automate knobs, so
    the TIME "sweep" is three renders of this fixture family:
    slice0 / slice3 / slice7 (TIME = 0, 3/7, 1).
  module_slugs:
    0: '4msCompany:HubMedium'
    1: 'RobotBoy:Echos'
  int_cables: []
  mapped_ins:
    - panel_jack_id: 0
      ins:
        - module_id: 1
          jack_id: 0
    - panel_jack_id: 1
      ins:
        - module_id: 1
          jack_id: 9
  mapped_outs:
    - panel_jack_id: 0
      out:
        module_id: 1
        jack_id: 0
    - panel_jack_id: 1
      out:
        module_id: 1
        jack_id: 1
  static_knobs:
    - {module_id: 1, param_id: 1, value: 0.3636364}
    - {module_id: 1, param_id: 2, value: 0.4285714}
    - {module_id: 1, param_id: 6, value: 1.0}
  vcvModuleStates: []
  bypassed_modules: []
