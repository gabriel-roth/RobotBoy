PatchData:
  patch_name: demo_karplus
  description: >-
    Retours Karplus-Strong demo - DENSITY=0 pushes the manual base time to the
    kMinDelaySeconds clamp (2 ms -> 500 Hz), FEEDBACK=0.95 rings it out.
    Input: demo_karplus_in.wav (8 ms noise burst on ch0). Mono in (IN_R left
    unmapped so it normals from L). Expect a pitched ~500 Hz pluck decaying
    over roughly the full 2 s render.
