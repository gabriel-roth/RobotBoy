<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.0750 -0.6776 2.1500 1.3552">
  <!-- INTERVAL, counter-clockwise: a single delay tap per period. Two ticks
       1.7mm apart bound one repeat period; nothing falls between them. Pairs
       with interval-extra-tap.svg, which is this glyph plus one inserted
       tick; the outer ticks are identical in both, so the eye compares only
       what happens in the gap. Tick height 0.9052mm (25% above the 0.7242mm
       Particules density ticks, for legibility at 1x).

       Stroke is 0.15mm, not the 0.1mm used by the shape legend and the
       attenurandomizer marks on this panel. Isolated hairline verticals are
       the worst case for the 0.1mm house weight: at Rack's rendering scale
       0.1mm is under one pixel wide, so each tick's brightness depends on
       where it happens to land on the pixel grid, and the ticks rendered
       unevenly (peaks 190-230 against a 136 plate, with a grey companion
       pixel beside each that read as smudging). At 0.15mm every tick clears
       a full pixel and they land at 225-255, matching the measured weight of
       the existing glyphs. The shape icons keep 0.1mm because their longer
       runs and filled areas do not suffer the same way. -->
  <line x1="-0.8500" y1="-0.4526" x2="-0.8500" y2="0.4526" stroke="#ffffff" stroke-width="0.15" stroke-linecap="round"/>
  <line x1="0.8500" y1="-0.4526" x2="0.8500" y2="0.4526" stroke="#ffffff" stroke-width="0.15" stroke-linecap="round"/>
</svg>
