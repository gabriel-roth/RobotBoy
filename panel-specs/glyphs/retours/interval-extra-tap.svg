<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.0500 -0.6526 2.1000 1.3052">
  <!-- INTERVAL, clockwise: an extra tap inside each period. The two outer
       ticks are identical to interval-single-tap.svg; the third sits at 0.618
       of the 1.7mm span (x = 0.2006) rather than at the midpoint, so it reads
       as arriving at a particular interval and not as a plain halving. It is
       drawn at ~2/3 height (0.6001 vs 0.9052mm) to mark it as the added,
       subordinate tap. -->
  <line x1="-0.8500" y1="-0.4526" x2="-0.8500" y2="0.4526" stroke="#ffffff" stroke-width="0.1" stroke-linecap="round"/>
  <line x1="0.8500" y1="-0.4526" x2="0.8500" y2="0.4526" stroke="#ffffff" stroke-width="0.1" stroke-linecap="round"/>
  <line x1="0.2006" y1="-0.3001" x2="0.2006" y2="0.3001" stroke="#ffffff" stroke-width="0.1" stroke-linecap="round"/>
</svg>
