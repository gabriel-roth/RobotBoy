# Brume panel spec (vcv-panel-gen) -- generates res/Brume.svg.
# Regenerate with (see panel-specs/README.md for setup):
#   ~/Dev/vcv-panel-gen/.venv/bin/python ~/Dev/vcv-panel-gen/panelgen.py panel-specs/brume.yaml --out res/Brume.svg
#
# 29 HP. Two colored plates (top, 5 cells in signal order: SEND, WOW,
# FILTER, SMEAR, PREDELAY; bottom, 6 cells: SIZE, DECAY, DAMP, DIFFUSE, SPEED, DEPTH) between a
# FOLLOW column on the far left (RISE, FALL, SOURCE, SIDE, ENV) and an Output column
# on the far right (WIDTH, MIX, BALANCE light). Cells are centered per plate.
# The FOLLOW and Output columns are the same width (17.75), 1.5 mm from the
# panel edges and 2.0 mm from the plates, so the plates sit centered.
# Each cell's label, knob, jack and trimpot sit at offsets 9.5 / 13.5 / 10 from one another. The FOLLOW column uses 8.5 mm from label
# to knob. Its plate starts at y = 6.0, just
# below the top-left corner screw and above the other plates (which start at
# 15.5), and runs down to the other plates' bottom edge (107.6). The ENV
# jack and label sit in an opaque panel-background (#3d3d3d) inset at the
# plate's foot, a "negative" rect marking the output. Above it, the ENV light,
# RISE, FALL, the IN/OUT switch and SIDE (label under the jack, like ENV) sit
# with equal 4.75 mm gaps from the plate top down to the inset. Arrows folded
# into the zone outlines show the signal path: FOLLOW points at both CV jack
# rows (meeting notches cut into the plates' left edges, since the follower
# is normalled to those jacks), the top plate points down into the bottom
# one, and the bottom plate points at MIX. The Output column runs the same height as FOLLOW: WIDTH and MIX
# (label 8.5 / knob 12.0 / jack 9.5 / trimpot) with three equal 7.601 gaps,
# above the dry/wet BALANCE light, which sits on the bottom plate's trimpot
# row. The bottom row (IN, MODE,
# QUALITY, CLEAR button + trigger, OUT): IN and OUT inset equally from the
# panel edges, the three units between them with equal 17.406 gaps.
#
# Every x/y here must match the mm2px(Vec(...)) centers in src/Brume.cpp.
