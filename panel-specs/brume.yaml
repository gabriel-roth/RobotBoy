# Brume panel spec (vcv-panel-gen) -- generates res/Brume.svg.
# Regenerate with (see panel-specs/README.md for setup):
#   ~/Dev/vcv-panel-gen/.venv/bin/python ~/Dev/vcv-panel-gen/panelgen.py panel-specs/brume.yaml --out res/Brume.svg
#
# 29 HP. Two colored plates (top, 5 cells: SEND, FILTER, SMEAR, PREDELAY,
# WOW; bottom, 6 cells: SIZE, DECAY, DAMP, DIFFUSE, SPEED, DEPTH) between a
# FOLLOW column on the far left (RISE, FALL, SOURCE, SIDE, ENV) and an Output column
# on the far right (CLEAR, WIDTH, DRY/WET). Cells are centered per plate.
# Each cell's label, knob, jack and trimpot sit at offsets 9.5 / 13.5 / 10 from one another. The FOLLOW column uses 8.5 mm from label
# to knob. Its plate starts at y = 6.0, just
# below the top-left corner screw and above the other plates (which start at
# 15.5), and runs down to the other plates' bottom edge (107.6). The ENV
# jack and label sit in an opaque panel-background (#3d3d3d) inset at the
# plate's foot, a "negative" rect marking the output. A thin bar under FALL
# splits the plate: timing above (ENV light, RISE, FALL; 3.5 mm gaps from the
# plate top), source below (the IN/OUT switch, then SIDE with its label under
# the jack, like ENV; 4.87 mm gaps down to the inset), 4.2 mm either side of
# the bar. The Output column runs the same height as FOLLOW: CLEAR (button and
# trigger jack) on top, then WIDTH and DRY/WET, with four equal gaps. The
# bottom row (IN, MODE, QUALITY, OUT) has equal gaps to the panel edges.
#
# Every x/y here must match the mm2px(Vec(...)) centers in src/Brume.cpp.
