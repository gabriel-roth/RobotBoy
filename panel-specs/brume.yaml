# Brume panel spec (vcv-panel-gen) -- generates res/Brume.svg.
# Regenerate with (see panel-specs/README.md for setup):
#   ~/Dev/vcv-panel-gen/.venv/bin/python ~/Dev/vcv-panel-gen/panelgen.py panel-specs/brume.yaml --out res/Brume.svg
#
# 33 HP. Four colored plates (top left, 5 cells: SEND, FILTER, SMEAR,
# PREDELAY, WOW; top right: SHIMMER, INTERVAL; bottom left, 6 cells: SIZE,
# DECAY, DAMP, DIFFUSE, SPEED, DEPTH; bottom right: WIDTH, DRY/WET) plus a
# FOLLOW column on the far left (RISE, FALL, SIDE, ENV). Cells are centered
# per plate. Each cell's label, knob, jack and trimpot sit at offsets
# 9.5 / 13.5 / 10 from one another. The FOLLOW column uses 8.5 mm from label
# to knob. Its plate starts at y = 6.0, just
# below the top-left corner screw and above the other plates (which start at
# 15.5), so the follower glyph sits on it, and runs down to the other plates'
# bottom edge (107.6). The ENV jack and label sit in an opaque
# panel-background (#3d3d3d) inset at the plate's foot, a "negative" rect
# marking the output. Down the plate, the five gaps between the follower
# glyph, the ENV light, RISE, FALL, SIDE and the inset are equal (about
# 5.36 mm). The bottom row (IN, MODE, QUALITY, CLEAR, OUT) has equal gaps to
# the panel edges.
#
# Every x/y here must match the mm2px(Vec(...)) centers in src/Brume.cpp.
