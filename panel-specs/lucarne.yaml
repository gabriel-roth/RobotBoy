# Lucarne panel spec (vcv-panel-gen) — generates res/Lucarne.svg (VCV). Regenerate
# with (see panel-specs/README.md for setup):
#   ~/Dev/vcv-panel-gen/.venv/bin/python ~/Dev/vcv-panel-gen/panelgen.py panel-specs/lucarne.yaml --out res/Lucarne.svg
#
# Twins: lucarne-retours.yaml (the Retours key) and lucarne-empty.yaml (no
# module attached: the setup instruction instead of a key); keep them in sync.
#
# Lucarne is a display-only expander for Particules: a wordmark, one screen
# and a key. No params, ports or lights. The MetaModule faceplate comes from
# lucarne-mm.yaml instead (16:9 screen, no key: unreadable at \~1.9 px/mm).
#
# Screen: full usable width (54 mm, centered: (60.96 - 54) / 2 = 3.48), 60 mm
# tall. Keep the SCREEN rect in sync with kScreen* in src/lucarne/Lucarne.cpp.
#
# Key: 2 x 2 cells under the screen (Length, Height / Color, Brightness),
# each a glyph over a two-line caption: the property on the display, 2.3 mm
# in gray, then what it shows, 2.6 mm in white (the meaning carries the
# emphasis). The cursor and write-head line are self-explanatory, so
# they have no cells.
# Columns sit 13.5 mm either side of the panel center (30.48), so each cell
# has \~25 mm; the widest caption, Retours' "Newest at right", is \~23 mm.
# Glyphs are scaled 1.375x (the tallest, 4.8 mm unscaled, have half-height
# 3.3). A cell spans glyph top (y - 3.3) to caption line 2 (y + 10.1) =
# 13.4 mm; two cells in the 42 mm backdrop (y 79 to 121) leave 15.2 mm,
# split into 3 gaps of 5.1: glyph rows at 87.4 and 105.8. Captions: line 1
# baseline glyph + 6.35, line 2 + 10.1.
slug: Lucarne
name: LUCARNE
hp: 12

theme:
  screws: none    # the module widget draws its own ScrewBlack corners.

title:
  size: 6.35
  tracking: 0.661458
  # Same title baseline as Particules/Retours so the panels line up.
  dy: 1.211

# Key backdrop: a lavender zone behind the key, in the house zone style (1.5 mm
# from the panel edges, rx 2, like Particules). y 79 to 121: 5 mm below the
# screen and clear of the bottom screws (125.5). The key, or the setup
# instruction, is centered in it.
# Dusty lavender at 0.4 over #3d3d3d resolves to #625e6b: between
# Particules' rose and the display's blues.
zones:
  - {x: 1.5, y: 79, w: 57.96, h: 42, rx: 2, fill: "#9a8fb0", opacity: 0.4}

grids:
  key:
    cols: [16.98, 43.98]
    rows:
      glyph1: 87.4
      cap1a: 93.7
      cap1b: 97.5
      glyph2: 105.8
      cap2a: 112.2
      cap2b: 115.9

elements:
  - {name: SCREEN, kind: widget, rect: {x: 3.48, y: 14, w: 54, h: 60}}

  - row: {grid: key, at: cap1a}
    place: [{text: Length, size: 2.3, color: "#b0b0b0"}, {text: Height, size: 2.3, color: "#b0b0b0"}]
  - row: {grid: key, at: cap1b}
    place: [{text: Buffer segment, size: 2.6}, {text: Pitch, size: 2.6}]
  - row: {grid: key, at: cap2a}
    place: [{text: Color, size: 2.3, color: "#b0b0b0"}, {text: Brightness, size: 2.3, color: "#b0b0b0"}]
  - row: {grid: key, at: cap2b}
    place: [{text: Stereo pan, size: 2.6}, {text: Envelope, size: 2.6}]

glyphs:
  - {src: glyphs/lucarne/length.svg,   at: [16.98, 87.4], scale: 1.375}
  # pitch.svg's band is a lighter blue (#7d9ab5) than the display's waveform
  # (#51667a), which disappears against the lavender backdrop.
  - {src: glyphs/lucarne/pitch.svg,    at: [43.98, 87.1], scale: 1.1}   # taller glyph: 0.8 x 1.375 to clear its caption
  - {src: glyphs/lucarne/pan.svg,      at: [16.98, 105.8], scale: 1.375}
  - {src: glyphs/lucarne/envelope.svg, at: [43.98, 105.8], scale: 1.375}
