# Lucarne panel spec, Retours key (vcv-panel-gen) — generates res/Lucarne-Retours.svg
# (VCV). Regenerate with (see panel-specs/README.md for setup):
#   ~/Dev/vcv-panel-gen/.venv/bin/python ~/Dev/vcv-panel-gen/panelgen.py panel-specs/lucarne-retours.yaml --out res/Lucarne-Retours.svg
#
# Twin of lucarne.yaml for Lucarne attached to Retours: keep everything except the key captions and glyphs in sync with it.
# LucarneWidget swaps to this panel while Retours sits on the left. Third twin:
# lucarne-empty.yaml (no module attached).
#
# Lucarne is a display-only expander for Particules and Retours: a wordmark, one screen
# and a key. No params, ports or lights. The MetaModule faceplate comes from
# lucarne-mm.yaml instead (16:9 screen, no key: unreadable at \~1.9 px/mm).
#
# Screen: full usable width (54 mm, centered: (60.96 - 54) / 2 = 3.48), 60 mm
# tall. Keep the SCREEN rect in sync with kScreen* in src/Lucarne.cpp.
#
# Key: two full-width cells under the screen, one per row, each a glyph
# 44 mm wide (the bars' span) over its captions. The scrolling waveform
# explains itself, so it has no cell of its own.
# - Tap markers: the waveform crossed by a warm-white and a green tap line,
#   18 mm apart, with "Primary" and "Secondary" (2.3 mm, gray) under them and
#   "Tap markers" (2.6 mm, white) below. Lucarne draws the louder ratio's
#   taps white and the other's green (ScopeLayout::tapColor).
# - Tap level: a crescendo waveform with seven markers whose lines brighten
#   and whose bars grow with the waveform under them, as a tap flashes on the
#   display; captioned "Tap level" (2.6 mm, white).
# Both glyphs are drawn in panel mm (scale 1), 6.6 mm tall (half-height 3.3).
# Each cell is centered on the matching row of lucarne.yaml's key, so the
# twins line up: top row 84.1 to 97.5 (center 90.8), bottom row 102.5 to
# 115.9 (center 109.2).
# - Top: glyph top (y - 3.0) to "Tap markers" (y + 9.8): y = 87.4; the
#   gray line at y + 6.1 (93.5), "Tap markers" at 97.2.
# - Bottom: glyph top (y - 3.3) to "Tap level" (y + 6.6): y = 107.55 (107.6),
#   caption at 114.2; then lowered 0.4 to 114.6 (user choice).
slug: Lucarne
name: LUCARNE
hp: 12

theme:
  screws: none    # the module widget draws its own ScrewBlack corners.

title:
  size: 6.35
  tracking: 0.661458
  # Same title baseline as Particules/Retours so the panels line up.
  dy: 1.211

# Key backdrop: a lavender zone behind the key, in the house zone style (1.5 mm
# from the panel edges, rx 2, like Particules). y 79 to 121: 5 mm below the
# screen and clear of the bottom screws (125.5). The key, or the setup
# instruction, is centered in it.
# Dusty lavender at 0.4 over #3d3d3d resolves to #625e6b: between
# Particules' rose and the display's blues.
zones:
  - {x: 1.5, y: 79, w: 57.96, h: 42, rx: 2, fill: "#9a8fb0", opacity: 0.4}

elements:
  - {name: SCREEN, kind: widget, rect: {x: 3.48, y: 14, w: 54, h: 60}}

  # Under the tap lines, which sit 9 mm either side of the panel center.
  - {text: Primary, x: 21.48, y: 93.5, size: 2.3, color: "#b0b0b0"}
  - {text: Secondary, x: 39.48, y: 93.5, size: 2.3, color: "#b0b0b0"}
  - {text: Tap markers, x: 30.48, y: 97.2, size: 2.6}
  - {text: Tap level, x: 30.48, y: 114.6, size: 2.6}

glyphs:
  # Bars in #7d9ab5 (lighter than the display's #51667a so they show on the
  # lavender); tap-level.svg's at half opacity, behind its markers.
  - {src: glyphs/lucarne/tap-markers.svg, at: [30.48, 87.4]}
  - {src: glyphs/lucarne/tap-level.svg,   at: [30.48, 107.6]}
