# Lucarne panel spec, Retours key (vcv-panel-gen) — generates res/Lucarne-Retours.svg
# (VCV). Regenerate with (see panel-specs/README.md for setup):
#   ~/Dev/vcv-panel-gen/.venv/bin/python ~/Dev/vcv-panel-gen/panelgen.py panel-specs/lucarne-retours.yaml --out res/Lucarne-Retours.svg
#
# Twin of lucarne.yaml for Lucarne attached to Retours: keep everything except the key captions and glyphs in sync with it.
# LucarneWidget swaps to this panel while Retours sits on the left. Third twin:
# lucarne-empty.yaml (no module attached).
#
# Lucarne is a display-only expander for Particules and Retours: a wordmark, one screen
# and a key. No params, ports or lights. The MetaModule faceplate comes from
# lucarne-mm.yaml instead (16:9 screen, no key: unreadable at \~1.9 px/mm).
#
# Screen: full usable width (54 mm, centered: (60.96 - 54) / 2 = 3.48), 60 mm
# tall. Keep the SCREEN rect in sync with kScreen* in src/Lucarne.cpp.
#
# Key: 2 x 2 cells under the screen (Buffer, Tap markers / Color,
# Brightness), each a glyph over a caption. The top glyphs explain
# themselves, so their captions are one line, 2.6 mm in white. The bottom
# cells have two lines: the property on the display, 2.3 mm in gray, then
# what it shows, 2.6 mm in white (the meaning carries the emphasis). The
# write head and cursors have no cells of their own.
# Columns sit 13.5 mm either side of the panel center (30.48), so each cell
# has \~25 mm.
# Glyphs are scaled 1.375x (the tallest, 4.8 mm unscaled, have half-height
# 3.3). A cell spans glyph top (y - 3.3) to caption line 2 (y + 10.1) =
# 13.4 mm; two cells in the 42 mm backdrop (y 79 to 121) leave 15.2 mm,
# split into 3 gaps of 5.1: glyph rows at 87.4 and 105.8. Captions: line 1
# baseline glyph + 6.35, line 2 + 10.1. Here the top cells are one line: a
# 2.6 mm caption at glyph + 6.6 (the 1.3 mm gap under the glyph, plus its cap
# height), so a cell spans y - 3.3 to y + 6.6, center y + 1.65. lucarne.yaml's
# top cells span 84.1 to 97.5, center 90.8; centering on that puts this
# glyph row at 89.15 (89.2) and the caption at 95.8. The bottom row matches
# lucarne.yaml's.
slug: Lucarne
name: LUCARNE
hp: 12

theme:
  screws: none    # the module widget draws its own ScrewBlack corners.

title:
  size: 6.35
  tracking: 0.661458
  # Same title baseline as Particules/Retours so the panels line up.
  dy: 1.211

# Key backdrop: a lavender zone behind the key, in the house zone style (1.5 mm
# from the panel edges, rx 2, like Particules). y 79 to 121: 5 mm below the
# screen and clear of the bottom screws (125.5). The key, or the setup
# instruction, is centered in it.
# Dusty lavender at 0.4 over #3d3d3d resolves to #625e6b: between
# Particules' rose and the display's blues.
zones:
  - {x: 1.5, y: 79, w: 57.96, h: 42, rx: 2, fill: "#9a8fb0", opacity: 0.4}

grids:
  key:
    cols: [16.98, 43.98]
    rows:
      glyph1: 89.2
      cap1: 95.8
      glyph2: 105.8
      cap2a: 112.2
      cap2b: 115.9

elements:
  - {name: SCREEN, kind: widget, rect: {x: 3.48, y: 14, w: 54, h: 60}}

  - row: {grid: key, at: cap1}
    place: [{text: Buffer, size: 2.6}, {text: Tap markers, size: 2.6}]
  - row: {grid: key, at: cap2a}
    place: [{text: Color, size: 2.3, color: "#b0b0b0"}, {text: Brightness, size: 2.3, color: "#b0b0b0"}]
  - row: {grid: key, at: cap2b}
    place: [{text: Tap ratio, size: 2.6}, {text: Tap output, size: 2.6}]

glyphs:
  # scroll.svg and marker.svg draw the scope's waveform as a band of uneven
  # bars in #7d9ab5 (lighter than the display's #51667a so it shows on the
  # lavender). scroll.svg: the band with a left-pointing arrow (audio moves
  # right to left). marker.svg: the band crossed by the two tap lines, in
  # the tap-ratio colors. Both are 4.8 mm tall, the height the key's rows
  # are spaced for, so they take the key's 1.375x like the rest.
  - {src: glyphs/lucarne/scroll.svg,   at: [16.98, 89.2], scale: 1.375}
  - {src: glyphs/lucarne/marker.svg,   at: [43.98, 89.2], scale: 1.375}
  - {src: glyphs/lucarne/ratio.svg,    at: [16.98, 105.8], scale: 1.375}
  - {src: glyphs/lucarne/envelope.svg, at: [43.98, 105.8], scale: 1.375}
