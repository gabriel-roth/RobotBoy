# Lucarne panel spec, Retours key (vcv-panel-gen) — generates res/Lucarne-Retours.svg
# (VCV). Regenerate with (see panel-specs/README.md for setup):
#   ~/Dev/vcv-panel-gen/.venv/bin/python ~/Dev/vcv-panel-gen/panelgen.py panel-specs/lucarne-retours.yaml --out res/Lucarne-Retours.svg
#
# Twin of lucarne.yaml for Lucarne attached to Retours: keep everything except the key in sync with it.
# LucarneWidget swaps to this panel while Retours sits on the left. Third twin:
# lucarne-empty.yaml (no module attached).
#
# Lucarne is a display-only expander for Particules and Retours: a wordmark, one screen
# and a key. No params, ports or lights. The MetaModule faceplate comes from
# lucarne-mm.yaml instead (16:9 screen, no key: unreadable at \~1.9 px/mm).
#
# Screen: full usable width (54 mm, centered: (60.96 - 54) / 2 = 3.48), 60 mm
# tall. Keep the SCREEN rect in sync with kScreen* in src/Lucarne.cpp.
#
# Key: one full-width cell under the screen, the tap-markers glyph over three
# labels. The scrolling waveform explains itself, so it has no cell of its own.
# The glyph is the waveform (#7d9ab5 bars, lighter than the display's #51667a
# so they show on the lavender) crossed by three markers, as on the display:
# an amber and a cyan tap line (Lucarne draws the louder ratio's taps amber
# and the other's cyan, ScopeLayout::tapColor) and the near-white play head
# (kDryColor), 6% of the width in from the right edge (kNowInset), with no
# waveform past it. Each marker flashes a bar as wide as a waveform bar and as
# tall as the waveform under it (the play head's: the newest audio), its line
# brightened with that level. The levels run loud, quiet, medium, so the
# flash reads as level. The tap lines sit on bar centers.
# Drawn in panel mm (scale 1): 44 mm of bars, 25.65 mm tall (half-height
# 12.825). The cell spans lucarne.yaml's key, 84.1 (glyph top) to 115.9 (last
# label line), centered in the zone: glyph at y = 96.925.
# Labels (2.3 mm, white) are stacked on two lines, at 113.0 and 115.9, each
# centered under its marker; the play head's x is fixed (49.84), and the taps
# are placed so the three labels have even gaps.
# The glyph's colored shapes are invisible placeholders (opacity 0):
# LucarneKey (src/Lucarne.cpp) paints them in the module's color scheme at the
# positions in src/lucarne/KeyLayout.hpp, which tests/test_lucarne_key.py
# checks against this panel. Move the glyph, then update KeyLayout.hpp.
slug: Lucarne
name: LUCARNE
hp: 12

theme:
  screws: none    # the module widget draws its own ScrewBlack corners.

title:
  size: 6.35
  tracking: 0.661458
  # Same title baseline as Particules/Retours so the panels line up.
  dy: 1.211

# Key backdrop: a lavender zone behind the key, in the house zone style (1.5 mm
# from the panel edges, rx 2, like Particules). y 79 to 121: 5 mm below the
# screen and clear of the bottom screws (125.5). The key, or the setup
# instruction, is centered in it.
# Dusty lavender at 0.4 over #3d3d3d resolves to #625e6b: between
# Particules' rose and the display's blues.
zones:
  - {x: 1.5, y: 79, w: 57.96, h: 42, rx: 2, fill: "#9a8fb0", opacity: 0.4}

elements:
  - {name: SCREEN, kind: widget, rect: {x: 3.48, y: 14, w: 54, h: 60}}

  - {text: Primary, x: 12.728, y: 113.0, size: 2.3}
  - {text: tap, x: 12.728, y: 115.9, size: 2.3}
  - {text: Secondary, x: 32.317, y: 113.0, size: 2.3}
  - {text: tap, x: 32.317, y: 115.9, size: 2.3}
  - {text: Play, x: 49.84, y: 113.0, size: 2.3}
  - {text: head, x: 49.84, y: 115.9, size: 2.3}

glyphs:
  - {src: glyphs/lucarne/tap-markers.svg, at: [30.48, 96.925]}
