# Tune panel spec (vcv-panel-gen) — generates res/Tune.svg. Regenerate with
# (see panel-specs/README.md for setup):
#   ~/Dev/vcv-panel-gen/.venv/bin/python ~/Dev/vcv-panel-gen/panelgen.py panel-specs/tune.yaml --out res/Tune.svg
#
# Tune is a tuner and scope: two windows, the audio input, the V/oct output
# and OUT, a copy of the input for patching the tuner inline.
#
# 12 HP, in the Lucarne layout.
#  - Title: as large as fits between the top screws. The module draws
#    ScrewBlack heads (5.08 across) centered 7.62 from each side, so their
#    inner edges are at 10.16 and 50.80. Size 13.3 with tracking 1.38 (the
#    house 0.104 em) gives 38.55 mm of ink, 11.20 to 49.75: about 1.0 clear of
#    each screw. dx centers the ink (the trailing tracking and the side
#    bearings pull it left). Cap height 9.31, centered in the 14 mm band above
#    the windows: baseline (14 + 9.31) / 2 = 11.655, and the default baseline
#    is size + 1.0 = 14.3, so dy -2.645.
#  - Two 4:3 windows on the bare panel (54 x 40.5, centered: (60.96 - 54) / 2
#    = 3.48, 2.0 apart): SCREEN, the readout (note, cents, meter, Hz), over
#    SCOPE, the waveform. 4:3 is the MetaModule full-screen shape. Keep both
#    rects in sync with src/Tune.cpp.
#  - Jack plate (1.5-59.46, 101.5-121), 1.5 mm from the panel edges: IN,
#    V/OCT, OUT in three equal columns (plate width / 6 from each edge, then
#    / 3 apart: 11.16 / 30.48 / 49.8), jacks at 109, labels below at 117.5.
slug: Tune
name: TUNE
hp: 12

theme:
  title_color: "#e8e8e8"  # softer than the white labels, as on the other panels
  screws: none    # the module widget draws its own ScrewBlack corners.

title:
  size: 13.3
  tracking: 1.38
  dx: 0.81
  dy: -2.645

zones:
  - {x: 1.5, y: 101.5, w: 57.96, h: 19.5, rx: 2, fill: "#7f9fb3", opacity: 0.55}

elements:
  - {name: SCREEN, kind: widget, rect: {x: 3.48, y: 14, w: 54, h: 40.5}}
  - {name: SCOPE, kind: widget, rect: {x: 3.48, y: 56.5, w: 54, h: 40.5}}

  - {name: AUDIO_INPUT, x: 11.16, y: 109.0}
  - {text: IN, x: 11.16, y: 117.5}
  - {name: FREQ_OUTPUT, x: 30.48, y: 109.0}
  - {text: V/OCT, x: 30.48, y: 117.5}
  - {name: AUDIO_OUTPUT, x: 49.8, y: 109.0}
  - {text: OUT, x: 49.8, y: 117.5}
