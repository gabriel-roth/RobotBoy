# Ondes panel spec (panel-gen v2) — generates res/Ondes.svg with the
# component-center and label-path layout of the shipped panel. Regenerate
# with:
#   ~/Dev/vcv-panel-gen/.venv/bin/python ~/Dev/vcv-panel-gen/panelgen.py panel-specs/ondes.yaml --out res/Ondes.svg
#
# Component `name`s are the FULL C++ enum names (helper.py reads the id
# verbatim, splitting off "#Widget"), matching src/particules/Ondes.cpp.
#
# All x/y values below (grid columns/rows, absolute positions, label
# baselines) are the exact centers/baselines of the shipped panel — this
# spec reproduces the RESULTING layout, not any particular band-math
# derivation. Exception: the top area (title/SCREEN/zone top) was reworked
# after shipping — logo shrunk to the house 6.35 wordmark size, display
# enlarged, zone top raised; see the comments on those elements.
#
# Layout intent (carried forward from the panel's original design): logo,
# then a wavetable display (screen) drawing the live cyan trace, then Pitch
# knob + V/Oct jack side by side, then Bank/Position as two columns each
# knob -> CV jack -> attenuverter (Trimpot), Out centered at the bottom
# outside the cyan control plate. The cyan plate backs Pitch/Bank/Position
# but not the Out jack.
slug: Ondes
name: ONDES
hp: 8
side_margin: 3   # vestigial: every grid column below is an explicit literal,
                 # so side_margin has no effect on resolved geometry (kept
                 # for provenance parity with the v1 spec's value).

title:
  # Same wordmark size as Particules/Retours; at 6.35 it fits between the
  # top screws (untracked: the letterforms are 21.13mm wide, and any added
  # tracking would push into the screw keep-outs), so it sits at the
  # default baseline (size + 1.0 = 7.35) instead of the old size-9
  # dy: 2.3 drop below the screw line.
  size: 6.35

# Wavetable display: LedDisplay widget drawing the live cyan trace (see
# WavetableDisplay::drawLayer in Ondes.cpp) — bare rect placeholder here,
# same as Löp/Loooop's SCREEN.
elements:
  # Shrinking the logo freed 4.95mm: the display's top follows the wordmark
  # up (keeping the 2.05mm gap under it) and half the gain enlarges the
  # display (h 22.0 -> 24.5); the other half raises the zone rect's top.
  # Keep in sync with the WavetableDisplay position/size in Ondes.cpp.
  - {name: SCREEN, kind: widget, rect: {x: 3.0, y: 9.4, w: 34.64, h: 24.5}}

  # Pitch knob + V/Oct jack: a horizontal pair (not a grid column — each
  # side sits at its own one-off x), sharing a label centered on their
  # midpoint (= panel center, 20.32).
  - {name: PITCH_PARAM, x: 14.145, y: 51.35}
  - {name: VOCT_INPUT, x: 26.495, y: 51.35}
  - {text: Pitch, grid: main, col: 2, y: 44.35}

  # Bank (left) / Position (right): knob -> CV jack -> attenuverter
  # (Trimpot), each column labelled above the knob.
  - {text: Bank, grid: main, col: 1, row: ctrl_label}
  - {text: Position, grid: main, col: 3, row: ctrl_label}
  - {name: BANK_PARAM, grid: main, col: 1, row: knob}
  - {name: POSITION_PARAM, grid: main, col: 3, row: knob}
  - {name: BANK_INPUT, grid: main, col: 1, row: jack}
  - {name: POSITION_INPUT, grid: main, col: 3, row: jack}
  - {name: BANK_AMT_PARAM, widget: Trimpot, grid: main, col: 1, row: amt}
  - {name: POSITION_AMT_PARAM, widget: Trimpot, grid: main, col: 3, row: amt}

  # Out — outside the cyan plate, centered on the panel.
  - {name: OUT_OUTPUT, grid: main, col: 2, row: out}
  - {text: Out, grid: main, col: 2, row: out_label}

grids:
  # Bank (col 1) / center (col 2, shared by Pitch's label and Out) /
  # Position (col 3).
  main:
    cols: [11.66, 20.32, 28.98]
    rows:
      ctrl_label: 67.35   # Bank / Position labels
      knob:       74.35   # Bank / Position knobs
      jack:       86.7    # Bank / Position CV jacks
      amt:        97.05   # Bank / Position attenuverters (Trimpot)
      out:        113.7   # Out jack
      out_label:  122.05  # Out label

# Cyan plate behind Pitch/Bank/Position; does not extend down to the Out
# jack. Top raised 2.45mm (the other half of the logo-shrink gain, keeping
# the 2.4mm gap under the display); bottom unchanged at 107.0.
zones:
  - {x: 3.0, y: 36.3, w: 34.64, h: 70.7, fill: "#00e5ff", opacity: 0.25}

overlaps_ok:
  # The wordmark's bounding box nicks both top screw keep-outs by 0.15mm,
  # but the drawn art doesn't touch: the O/S left/right extremes sit at mid
  # cap height (~y 5.1), where the round screw circles have curved away to
  # ~0.9mm clear of the letterforms.
  - [title, "screw@7.50,3.00"]
  - [title, "screw@33.14,3.00"]

# Vertical bars: each column's knob -> CV jack -> attenuverter. No connector
# between Pitch and V/Oct (horizontal pair, not a stack) or to Out (sits
# outside the plate on its own).
connectors:
  - [BANK_PARAM, BANK_INPUT]
  - [BANK_INPUT, BANK_AMT_PARAM]
  - [POSITION_PARAM, POSITION_INPUT]
  - [POSITION_INPUT, POSITION_AMT_PARAM]
