# Ondes — wavetable oscillator, 8 HP. Regenerated with vcv-panel-gen; house
# theme (dark panel, Futura labels, Shuttleblock title) inherited from
# ~/.config/vcv-panel-gen/theme.yaml. Layout: title, wavetable display
# (screen), Pitch knob + V/Oct beside it, then Bank/Position columns each as
# knob -> CV jack -> attenuverter, Out centered at the bottom. A single cyan
# plate (zones:) backs Pitch/Bank/Position but not the Out jack — its geometry
# is derived from the generated component positions (see plan Task 1).
slug: Ondes
name: ONDES
hp: 8
title_size: 9            # bigger logo — dropped below the screws (see TITLE nudge)
side_margin: 3
title_valign: baseline
rows:
  - type: screen
    height: 22             # taller display
    gap_above: 4.35        # display just below the logo (Löp logo->display gap 2.05)
  - type: inputs           # Pitch knob + V/Oct jack, horizontal companion
    label_side: above
    gap_above: 5.0         # distribute controls within the rect
    items:
      - {label: Pitch, name: PITCH_PARAM, type: knobs, cv: VOCT_INPUT}
  - type: params           # Bank / Position: knob over stacked CV jack (aligned)
    gap_above: 5.0
    items:
      - {label: Bank,     name: BANK_PARAM,     cv: BANK_INPUT}
      - {label: Position, name: POSITION_PARAM, cv: POSITION_INPUT}
  - type: knobs            # Bank / Position attenuverters (unlabeled trimpots),
    gap_above: -3.0        # tucked up close to the CV jacks above them
    items:
      - {label: "{blank}", name: BANK_AMT_PARAM,     widget: Trimpot, small: true}
      - {label: "{blank}", name: POSITION_AMT_PARAM, widget: Trimpot, small: true}
  - type: outputs          # Out — outside the cyan plate, at MF-20 Out level (~113.7)
    label_side: below
    gap_above: 1.3
    items:
      - {label: Out, name: OUT_OUTPUT}
# Vertical lines tying each CV jack to the attenuverter tucked below it.
connectors:
  - [BANK_INPUT, BANK_AMT_PARAM]
  - [POSITION_INPUT, POSITION_AMT_PARAM]
nudges:
  TITLE: [0, 2.3]          # logo just below the top screws
zones:
  # Cyan plate behind Pitch/Bank/Position; geometry re-derived from the new
  # component positions (below the display, above the Out jack).
  - {x: 3.0, y: 38.75, w: 34.64, h: 68.25, fill: "#00e5ff", opacity: 0.25, rx: 2}
