# Onbetap — Polivoks-style multimode filter. Regenerated with vcv-panel-gen;
# house theme inherited from ~/.config/vcv-panel-gen/theme.yaml.
#
# Layout: Cutoff hero at top-center, flanked a little below by Resonance (left)
# and Drive (right). Three aligned columns, each knob -> attenuverter -> CV jack;
# Cutoff labelled above, Resonance/Drive labelled below their jacks. Mode is a
# hero snap knob with the five responses ringed around it. Stereo In/Out below.
slug: Onbetap
name: ONBETAP
hp: 10
side_margin: 5
title_size: 9

rows:
  # Q (resonance) / Cutoff (hero) / Drive. All three labelled above their knobs;
  # sharing this row, Q and Drive get the same label-to-knob-edge gap as Cutoff.
  # Reso/Drive nudged down to flank the hero.
  - type: knobs
    gap_above: 7           # seat the CUTOFF label on the red rect, clear of the title
    items:
      - {label: Q,      name: RES_PARAM}
      - {label: Cutoff, name: CUTOFF_PARAM, hero: true}
      - {label: Drive,  name: DRIVE_PARAM}

  # Attenuverters (Trimpot), one per column, all blank.
  - type: knobs
    gap_above: 1
    items:
      - {label: "{blank}", name: RES_CV_PARAM,    widget: Trimpot, small: true}
      - {label: "{blank}", name: CUTOFF_CV_PARAM, widget: Trimpot, small: true}
      - {label: "{blank}", name: DRIVE_CV_PARAM,  widget: Trimpot, small: true}

  # CV jacks, one per column. A knobs row (shared column centres) with per-item
  # input overrides keeps them aligned under the attenuverters. All unlabelled —
  # each column is named by the knob label at the top of its stack.
  - type: knobs
    gap_above: 1
    items:
      - {label: "{blank}", name: RES_INPUT,    type: inputs}
      - {label: "{blank}", name: CUTOFF_INPUT, type: inputs}
      - {label: "{blank}", name: DRIVE_INPUT,  type: inputs}

  # Mode: hero snap knob with the five filter responses ringed around it.
  - type: knobs
    label_side: below
    label_gap: 2
    items:
      - {label: Mode, name: MODE_PARAM, hero: true,
         positions: [LP, BP, HP, N, P]}

  # Stereo audio I/O.
  - type: inputs
    items:
      - {label: In,  name: AUDIO_INPUT,  pair: AUDIO_INPUT_R}
      - {label: Out, name: AUDIO_OUTPUT, pair: AUDIO_OUTPUT_R, type: outputs}

# Vertical lines tying each column's knob -> attenuverter -> jack.
connectors:
  - [RES_PARAM, RES_CV_PARAM]
  - [RES_CV_PARAM, RES_INPUT]
  - [CUTOFF_PARAM, CUTOFF_CV_PARAM]
  - [CUTOFF_CV_PARAM, CUTOFF_INPUT]
  - [DRIVE_PARAM, DRIVE_CV_PARAM]
  - [DRIVE_CV_PARAM, DRIVE_INPUT]

# Soviet-red control zone behind the cluster; the I/O row sits below it.
zones:
  - {x: 1.5, y: 15, w: 47.8, h: 92, fill: "#9e2b25", opacity: 0.25}

nudges:
  TITLE: [0, 2.3]           # drop the wordmark below the top screws
  RES_PARAM:   [0, 7]       # drop Q to flank the cutoff hero a little below
  DRIVE_PARAM: [0, 7]
  MODE_PARAM:  [0, -5]      # lift Mode so its label stays on the rect
