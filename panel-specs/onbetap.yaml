# Onbetap panel spec (panel-gen v2) — generates res/Onbetap.svg with the
# component-center and label-path layout of the shipped panel. Regenerate
# with:
#   ~/Dev/vcv-panel-gen/.venv/bin/python ~/Dev/vcv-panel-gen/panelgen.py panel-specs/onbetap.yaml --out res/Onbetap.svg
#
# Component `name`s are the FULL C++ enum names (helper.py reads the id
# verbatim, splitting off "#Widget"), matching Onbetap.cpp.
#
# All x/y values below (grid columns/rows, absolute positions, label
# baselines) are the exact centers/baselines of the shipped panel — this
# spec reproduces the RESULTING layout, not any particular band-math
# derivation.
#
# Layout intent (carried forward from the panel's original design): Cutoff
# hero at top-center, flanked a little below by Q/Resonance (left) and Drive
# (right) — three aligned columns, each knob -> attenuverter -> CV jack.
# Cutoff's label sits above it at the row's nominal (un-nudged) line; Q and
# Drive sit at that same nominal baseline even though their knobs were
# dropped 7mm to flank the hero, so all three labels read as one line above
# the cluster. Mode is a hero snap knob below, with its five filter
# responses ringed around it and "Mode" labelled below. Stereo In/Out below
# that.
slug: Onbetap
name: ONBETAP
hp: 10
side_margin: 5

title:
  size: 9
  dy: 2.3   # drops the wordmark below the top screws, clear of the title band
  kern:     # per-pair kerning (em) from the kerning review
    - {pair: "ON", em: 0.02}  # straight+straight (O has flat sides) — open
                              # ("ON" quoted: YAML reads bare ON as boolean true)
    - {pair: NB, em: 0.02}    # straight+straight — open a hair
    - {pair: TA, em: -0.06}   # diagonal+diagonal — two wedges, tighten hard
    - {pair: AP, em: -0.02}   # A's apex overhangs; tuck P in

# Soviet-red control zone tint behind the whole control cluster; the I/O row
# sits below it.
zones:
  - {x: 1.5, y: 15, w: 47.8, h: 92, fill: "#9e2b25", opacity: 0.25}

grids:
  # 3-column control grid, same columns as MF-20's: Q (col 1) | Cutoff/Mode
  # (col 2) | Drive (col 3).
  main:
    cols: [11.8, 25.4, 39.0]
    rows:
      hero:   33.5     # Cutoff hero knob (RoundBigBlackKnob), center column only
      flank:  40.5     # Q / Drive knobs (RoundBlackKnob), outer columns —
                       # dropped 7mm below the row's nominal line to flank
                       # the taller hero knob
      atten:  52.5     # Q/Cutoff/Drive CV attenuverters (Trimpot)
      cv_jack: 64.5    # CV input jacks, raised to sit 12mm below the
                       # attenuverters (same gap as knob->attenuverter)
      mode:   86.333333333333  # Mode hero snap knob

elements:
  # Row 1 — Cutoff hero (center) flanked by Q and Drive (outer columns,
  # dropped 7mm below the hero to visually flank it).
  - {name: CUTOFF_PARAM, widget: RoundBigBlackKnob, grid: main, col: 2, row: hero}
  - {name: RES_PARAM, grid: main, col: 1, row: flank}
  - {name: DRIVE_PARAM, grid: main, col: 3, row: flank}
  - {text: Q, x: 11.8, y: 30.5}
  - {text: Cutoff, x: 25.4, y: 23.5}
  - {text: Drive, x: 39.0, y: 30.5}

  # Row 2 — attenuverters (Trimpot), one per column, unlabelled.
  - {name: RES_CV_PARAM, widget: Trimpot, grid: main, col: 1, row: atten}
  - {name: CUTOFF_CV_PARAM, widget: Trimpot, grid: main, col: 2, row: atten}
  - {name: DRIVE_CV_PARAM, widget: Trimpot, grid: main, col: 3, row: atten}

  # Row 3 — CV jacks, one per column, unlabelled (each column is named by
  # the knob label at the top of its stack).
  - {name: RES_INPUT, grid: main, col: 1, row: cv_jack}
  - {name: CUTOFF_INPUT, grid: main, col: 2, row: cv_jack}
  - {name: DRIVE_INPUT, grid: main, col: 3, row: cv_jack}

  # Mode: hero snap knob (center column) with its five filter responses
  # ringed around it, labelled below.
  - {name: MODE_PARAM, widget: RoundBigBlackKnob, grid: main, col: 2, row: mode}
  - {ring: [LP, BP, HP, N, P], around: MODE_PARAM}
  - {text: Mode, x: 25.4, y: 100.333333333333}

  # Stereo audio I/O, sharing one centered label each.
  - {name: AUDIO_INPUT, x: 9.35, y: 114.016666666667}
  - {name: AUDIO_INPUT_R, kind: input, x: 19.05, y: 114.016666666667}
  - {name: AUDIO_OUTPUT, x: 31.75, y: 114.016666666667}
  - {name: AUDIO_OUTPUT_R, kind: output, x: 41.45, y: 114.016666666667}
  - {text: In, x: 14.2, y: 122.366666666667}
  - {text: Out, x: 36.6, y: 122.366666666667}

# Vertical bars: each column's knob -> attenuverter -> CV jack.
connectors:
  - [RES_PARAM, RES_CV_PARAM]
  - [RES_CV_PARAM, RES_INPUT]
  - [CUTOFF_PARAM, CUTOFF_CV_PARAM]
  - [CUTOFF_CV_PARAM, CUTOFF_INPUT]
  - [DRIVE_PARAM, DRIVE_CV_PARAM]
  - [DRIVE_CV_PARAM, DRIVE_INPUT]
