# Retours panel spec (vcv-panel-gen) — generates res/Retours.svg.
# Regenerate with (see panel-specs/README.md for setup):
#   ~/Dev/vcv-panel-gen/.venv/bin/python ~/Dev/vcv-panel-gen/panelgen.py panel-specs/retours.yaml --out res/Retours.svg
#
# 15 HP, laid out on Particules' grid (same columns, rows, label baselines,
# plate and I/O positions -- see particules.yaml), so the two Beads-derived
# panels read as siblings. Retours is Beads' delay mode, and the two controls
# added in the 15 HP redesign sit where Beads keeps them relative to
# Particules' layout:
#   - FILTER takes Particules' SIZE slot (top right): on Beads, delay mode's
#     filter is played from the Size attenurandomizer.
#   - REVERB takes Particules' REVERB slot.
# Both have a CV jack and a plain attenuverter trimpot (no randomizer mark),
# like FEEDBACK and DRY/WET.
#
# Every x/y here must match the mm2px(Vec(...)) centers in
# src/retours_delay/Retours.cpp, which are carried verbatim from this spec.
#
# Transport row: SLICE (input + latch button) on the left and CLOCK (tap
# button + input) on the right are mirror images about the panel center
# (38.1mm), with QUALITY centered between them. Each pair's label sits on
# the pair's midpoint.
#
# Knob-surround glyphs keep the offsets they had from their knobs on the
# 11 HP panel: shape legend around SHAPE, the tap-count ticks and the new
# low-/high-pass curves on the 45-degree diagonals below INTERVAL and FILTER,
# the unity-gain arrow at 82% of FEEDBACK's travel, and attenurandomizer
# marks above the TIME, PITCH and SHAPE trimpots.
slug: Retours
name: RETOURS
hp: 15

title:
  size: 6.35
  tracking: 0.661458
  kern:      # per-pair kerning (em) from the kerning review, on top of tracking
    - {pair: TO, em: -0.04}   # T's arm overhangs O's curve (O has flat sides)
    - {pair: OU, em: -0.01}   # a hair
    - {pair: UR, em: 0.02}    # straight+straight — open a hair
    - {pair: RS, em: -0.04}   # R's diagonal leg meets S's curve
  # Same title baseline as Particules (8.561mm, its shipped panel's measured
  # value) so the two 15 HP panels line up side by side; the default formula
  # (size + 1.0 = 7.35) sits 1.211mm higher.
  dy: 1.211

theme:
  screws: none    # the module widget draws its own ScrewBlack corners.

# Opaque grey control plate (Retours' colour) at Particules' plate size.
zones:
  - {x: 1.5, y: 28, w: 73.2, h: 79.6, rx: 2, fill: "#888888", opacity: 1.0}

grids:
  # Particules' 4-column knob/CV/attenuverter grid.
  main:
    cols: [12.6, 29.6, 46.6, 63.6]
    rows:
      knob1: 42.088
      cv1: 53.746
      atten1: 62.746
      knob2: 82.096
      cv2: 92.696
      atten2: 101.696

  labels:
    cols: [12.6, 29.6, 46.6, 63.6]
    rows:
      row1: 33.96
      row2: 74.468

elements:
  # --- Transport row, mirrored about the 38.1mm center line.
  - {name: SLICE_INPUT, x: 11.9, y: 15.875}
  - {name: SLICE_PARAM, widget: VCVButton, x: 20.4, y: 15.875}
  - {name: QUALITY_PARAM, widget: VCVBezel, x: 38.1, y: 15.875}
  - {name: CLOCK_PARAM, widget: VCVButton, x: 55.8, y: 15.875}
  - {name: CLOCK_INPUT, x: 64.3, y: 15.875}
  - {text: SLICE, x: 16.15, y: 24.0, size: 3.175}
  - {text: QUALITY, x: 38.1, y: 24.05, size: 3.175}
  - {text: CLOCK, x: 60.05, y: 24.0, size: 3.175}

  # --- Row 1: TIME / INTERVAL / PITCH / FILTER. INTERVAL's trimpot slot
  # holds the clock light, as before.
  - {text: TIME,     grid: labels, col: 1, row: row1, size: 3.175}
  - {text: INTERVAL, grid: labels, col: 2, row: row1, size: 3.175}
  - {text: PITCH,    grid: labels, col: 3, row: row1, size: 3.175}
  - {text: FILTER,   grid: labels, col: 4, row: row1, size: 3.175}
  - {name: TIME_PARAM,     grid: main, col: 1, row: knob1}
  - {name: INTERVAL_PARAM, grid: main, col: 2, row: knob1}
  - {name: PITCH_PARAM,    grid: main, col: 3, row: knob1}
  - {name: FILTER_PARAM,   grid: main, col: 4, row: knob1}
  - {name: TIME_CV_INPUT,     grid: main, col: 1, row: cv1}
  - {name: INTERVAL_CV_INPUT, grid: main, col: 2, row: cv1}
  - {name: PITCH_CV_INPUT,    grid: main, col: 3, row: cv1}
  - {name: FILTER_CV_INPUT,   grid: main, col: 4, row: cv1}
  - {name: TIME_AR_PARAM,   widget: Trimpot, grid: main, col: 1, row: atten1}
  - {name: CLOCK_LIGHT,     widget: "MediumLight<WhiteLight>", grid: main, col: 2, row: atten1}
  - {name: PITCH_AR_PARAM,  widget: Trimpot, grid: main, col: 3, row: atten1}
  - {name: FILTER_AR_PARAM, widget: Trimpot, grid: main, col: 4, row: atten1}

  # --- Row 2: SHAPE / FEEDBACK / REVERB / DRY/WET.
  - {text: SHAPE,     grid: labels, col: 1, row: row2, size: 3.175}
  - {text: FEEDBACK,  grid: labels, col: 2, row: row2, size: 3.175}
  - {text: REVERB,    grid: labels, col: 3, row: row2, size: 3.175}
  - {text: "DRY/WET", grid: labels, col: 4, row: row2, size: 3.175}
  - {name: SHAPE_PARAM,    grid: main, col: 1, row: knob2}
  - {name: FEEDBACK_PARAM, grid: main, col: 2, row: knob2}
  - {name: REVERB_PARAM,   grid: main, col: 3, row: knob2}
  - {name: DRY_WET_PARAM,  grid: main, col: 4, row: knob2}
  - {name: SHAPE_CV_INPUT,    grid: main, col: 1, row: cv2}
  - {name: FEEDBACK_CV_INPUT, grid: main, col: 2, row: cv2}
  - {name: REVERB_CV_INPUT,   grid: main, col: 3, row: cv2}
  - {name: DRY_WET_CV_INPUT,  grid: main, col: 4, row: cv2}
  - {name: SHAPE_AR_PARAM,    widget: Trimpot, grid: main, col: 1, row: atten2}
  - {name: FEEDBACK_AR_PARAM, widget: Trimpot, grid: main, col: 2, row: atten2}
  - {name: REVERB_AR_PARAM,   widget: Trimpot, grid: main, col: 3, row: atten2}
  - {name: DRY_WET_AR_PARAM,  widget: Trimpot, grid: main, col: 4, row: atten2}

  # --- Stereo audio I/O at Particules' positions, one label per pair.
  - {name: IN_L_INPUT,   x: 15.25, y: 114.3}
  - {name: IN_R_INPUT,   x: 24.95, y: 114.3}
  - {name: OUT_L_OUTPUT, x: 51.25, y: 114.3}
  - {name: OUT_R_OUTPUT, x: 60.95, y: 114.3}
  - {text: IN,  x: 20.1, y: 123.0, size: 3.175}
  - {text: OUT, x: 56.1, y: 123.0, size: 3.175}

glyphs:
  # Attenurandomizer marks (trimpot center x + 0.025, trimpot y - 3.297 in
  # row 1, - 3.31 in row 2).
  - {src: glyphs/retours/atten-random.svg, at: [12.625, 59.449]}
  - {src: glyphs/retours/atten-random.svg, at: [46.625, 59.449]}
  - {src: glyphs/retours/atten-random.svg, at: [12.625, 98.386]}
  # Shape legend around SHAPE (12.6, 82.096), CW from the min.
  - {src: glyphs/retours/shape-flat.svg,  at: [7.800,  86.858]}
  - {src: glyphs/retours/shape-pulse.svg, at: [7.844,  77.333]}
  - {src: glyphs/retours/shape-wave.svg,  at: [17.369, 77.333]}
  - {src: glyphs/retours/shape-caret.svg, at: [17.325, 86.858]}
  # Unity-gain arrow at 82% of FEEDBACK's (29.6, 82.096) travel; see
  # feedback-unity-arrow.svg for the angle and the 6.5mm radial placement.
  - {src: glyphs/retours/feedback-unity-arrow.svg, at: [36.069, 82.732]}
  # Tap-count legend on INTERVAL (29.6, 42.088) and low-/high-pass legend on
  # FILTER (63.6, 42.088): 45-degree diagonals 4.762mm out and down.
  - {src: glyphs/retours/interval-single-tap.svg, at: [24.838, 46.850]}
  - {src: glyphs/retours/interval-extra-tap.svg,  at: [34.363, 46.850]}
  - {src: glyphs/retours/filter-lowpass.svg,      at: [58.838, 46.850]}
  - {src: glyphs/retours/filter-highpass.svg,     at: [68.363, 46.850]}
