# Weaver (the Combine engine): 35 HP. Tinted plates 1.5 mm from the panel
# edges with 2.0 mm between them, title centered in a 17 mm band, display on
# the bare panel.
#  - Left column (1.50-89.24): display (full column width, 17-54.7; not
#    4:3, about 2.3:1), then three plain full-width plates, opaque (each
#    fill is its old 55% tint composited over the panel).
#    - Globals plate (56.7-74.8; controls top + 7.2, labels below at + 15.7):
#      a display naming the algorithm at its left end (13.3 tall, inset
#      2.4); then ALGORITHM (previous / next buttons 6.6 apart, chevrons
#      4.5 outside, and its CV jack 10.5 after the next button, labelled
#      together) and PRESET (previous / SAVE / next 7.6 apart with SAVE
#      larger, chevrons 4.5 outside, then a small red DELETE 2.5 past the
#      right chevron, labelled together). DELETE ends at 86.84, 2.4 in from
#      the plate's edge as the display starts 2.4 in; equal 3.5 gaps between
#      display, ALGORITHM and PRESET, counting the chevrons (1.36 wide) in
#      the widths, and the display takes the rest (16.38 wide).
#    - Clock plate (76.8-102.9, 26.1 tall): CLOCK (BPM knob + CLOCK jack,
#      10.5 apart), RESET (button + jack, 8.5 apart) and SPEED, equal 6.275
#      gaps with SPEED's chevrons counted in its width (27.76). CLOCK and
#      RESET centered in the plate (controls 88.0, labels 96.5). SPEED laid
#      out like Lyrebird's FILE: label on top (81.6), down / x1 / up buttons
#      8.7 apart with x1 larger (87.65), chevrons 4.5 outside, the down and
#      up trigger jacks 8.7 under their buttons (96.35, connectors).
#    - Output plate (104.9-123): OUT, INV, EOC and the margin before stripe
#      A in equal 6.08 gaps over 1.50-52.59, OUT circled by a thin ring in
#      the display's signal orange (the main trace's color). On the right,
#      full-height stripes (10 mm wide) in the operator colors, unlabelled,
#      each holding the operator's output over a lit latching button that
#      shows or hides its trace on the display, 8.5 apart, centered in the
#      stripe.
#  - Operator rows (91.24-176.30): one plate per operator in the original JS
#    prototype's operator colors, 32.83 mm tall (A, B, C from 24.50 / 57.33 / 90.16, ending at 123), under
#    a row of gray heading tabs (17-24.5, one per column, full column width, joined to plate A), the letter (heading size) in
#    the bottom-right corner of each plate (2 mm in from its right edge), in white at 60% over the plate, precomputed (Rack can't
#    read #rrggbbaa).
#    Five equal 17.01 cells from 91.24: 99.75 / 116.76 / 133.77 / 150.78 / 167.79.
#    Columns, left to right: RATIO, WAVE, PARAM, PHASE, LEVEL.
#    WAVE: a lit bezel button stepping through the waves (right-click lists them; light color shows
#    the wave, like Particules' QUALITY and Brume's MODE; no CV) under a small
#    live display of the operator's wave (drawn by the module, so it
#    shows on MetaModule too; it names what PARAM does for the current wave above the trace and
#    the wave below it). RATIO (snap), PARAM, PHASE, LEVEL: knob, CV
#    attenuator trimpot (RATIO: no trimpot, a small readout of the ratio above its knob) and CV jack, stacked with equal gaps (rows at top + 7.09 / 17.2 / 26.53);
#    the Wave display (14 x 17, from top + 3.89; its PARAM name level with the PARAM knob) over
#    its button (top + 26.53, level with the jacks). WAVE's tab spans WAVE and PARAM, which share a cell with no divider.
#    Hairline dividers between the columns, headings through row C.
slug: Weaver
name: WEAVER
hp: 35

title:
  size: 9.5
  tracking: 2.682
  # Centered vertically in the 17 mm band above the plates, as on Skylark; Skylark's tracking, ink flush with the display's left edge.
  x: 29.819
  dy: 2.75

