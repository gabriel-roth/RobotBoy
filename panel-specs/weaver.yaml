# Weaver (the Combine engine): 35 HP. Tinted plates 1.5 mm from the panel
# edges with 2.0 mm between them, title centered in a 17 mm band, display on
# the bare panel.
#  - Left column (1.50-89.24): display (full column width, 17-62.7; not
#    4:3, about 1.9:1), then three 18.1 mm rows (control row top + 7.2,
#    labels below at + 15.7). The plates on the right of the lower two rows
#    are L-shaped, so they're opaque: each fill is its old 55% tint
#    composited over the panel.
#    - Globals plate: a display naming the algorithm at its left end (26 x
#      13.3, inset 2.4); then ALGORITHM (the button that pops up the
#      algorithms + its CV jack, 9.0 apart, labelled together) and ENVELOPE
#      (the WINDOW knob, knob-end marks above its sides), gaps after the
#      display equalized by label width. The plate reaches down on the right
#      (50.37-89.24, to 92.85, about half the clock row) for PRESET: a label
#      and previous / next buttons side by side, chevrons beside.
#    - Clock plate (1.50-48.37): CLOCK (BPM knob + CLOCK jack, 10.5 apart)
#      and RESET (button + jack, 8.5 apart), 4.0 gaps.
#    - Output plate: OUT, INV, EOC spread over the clock plate's width, OUT
#      circled by a thin ring in the display's signal orange (the main
#      trace's color). On the right the plate reaches up (from 94.85) for A,
#      B, C: 10 mm tabs in their operator colors, each a lit latching button
#      that shows or hides the operator's trace on the display, over the
#      operator's output.
#  - Operator rows (91.24-176.30): one plate per operator in the original JS
#    prototype's operator colors, 32.83 mm tall (A, B, C from 24.50 / 57.33 / 90.16, ending at 123), under
#    a row of gray heading tabs (17-24.5, one per column, full column width, joined to plate A), the letter (heading size) in
#    the bottom-left corner of each plate.
#    Five equal 17.01 cells from 91.24: 99.75 / 116.76 / 133.77 / 150.78 / 167.79.
#    Columns, left to right: RATIO, WAVE, PARAM, PHASE, LEVEL.
#    WAVE: a lit bezel button stepping through the waves (light color shows
#    the wave, like Particules' QUALITY and Brume's MODE; no CV) over a small
#    live display of the operator's wave (13 x 10, inside its cell; drawn by the module, so it
#    shows on MetaModule too; it names what PARAM does for the current wave). RATIO (snap), PARAM, PHASE, LEVEL: knob, CV
#    attenuator trimpot (RATIO: no trimpot, a small readout of the ratio above its knob) and CV jack, stacked with equal gaps (rows at top + 7.09 / 17.2 / 26.53);
#    the Wave display (13 x 13, from top + 4.89; its PARAM name level with the PARAM knob) over
#    its button (top + 24.49). WAVE's tab spans WAVE and PARAM, which share a cell with no divider.
#    Hairline dividers between the columns, headings through row C.
