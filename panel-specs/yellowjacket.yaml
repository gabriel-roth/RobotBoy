# Yellowjacket panel spec (panel-gen v2) — generates res/Yellowjacket.svg with
# the component-center and label-path layout of the shipped panel. Regenerate
# with:
#   ~/Dev/vcv-panel-gen-redux/.venv/bin/python ~/Dev/vcv-panel-gen-redux/panelgen.py panel-specs/yellowjacket.yaml --out res/Yellowjacket.svg
#
# Component `name`s are the FULL C++ enum names (helper.py reads the id
# verbatim, splitting off "#Widget"), matching src/Yellowjacket.cpp.
#
# All x/y values below (grid columns/rows, absolute positions, label
# baselines) are the exact centers/baselines of the shipped panel — this
# spec reproduces the RESULTING layout, not any particular band-math
# derivation.
#
# Layout intent (carried forward from the panel's original design): an amber
# Wasp-style control zone holds the compressed knob cluster — three columns
# (Res | Freq hero | Drive), each knob -> attenuverter (Trimpot) -> CV jack,
# stacked directly beneath. Below the zone, on the bare panel: In (stereo
# audio input) beside a second amber zone holding Blend (regular knob, with
# its LP/N/HP ring) and Mix on the left, HP/BP/LP stereo outputs on the
# right, each L/R pair under one label.
#
# LAYOUT MUST STAY IN SYNC with panel-specs/yellowjacket-gold.yaml (the GOLD
# theme variant selected via the module's context menu) — every grid,
# element position, and connector below is shared verbatim between the two
# specs; only the `theme:` block, the zone `fill`/`opacity`, and the "In"
# label's color differ. Regenerate res/Yellowjacket-gold.svg after any
# layout change here.
slug: Yellowjacket
name: Yellowjacket
hp: 10
side_margin: 3
title:
  size: 5.8   # smaller than the house default — the near-full-width wordmark
  dy: 3.6     # drops the wordmark below the top screws

theme:
  # Brighten the Blend ring labels halfway from the default (#a8a8a8) to
  # white; everything else inherits the global charcoal theme.
  value_color: "#d3d3d3"

grids:
  # 3-column control cluster: Res (col 1) | Freq hero (col 2) | Drive (col 3).
  main:
    cols: [10.466666666666667, 25.4, 40.333333333333336]
    rows:
      hero:    29.2   # Freq hero knob (RoundBigBlackKnob), center column only
      flank:   32.0   # Res / Drive knobs (RoundBlackKnob), outer columns
      atten:   45.0   # Res/Freq/Drive CV attenuverters (Trimpot)
      cv_jack: 56.25  # CV input jacks, stacked below the attenuverters

elements:
  # Row 1 — Freq hero (center) flanked by Res and Drive (outer columns).
  - {name: RES_PARAM, grid: main, col: 1, row: flank}
  - {name: FREQ_PARAM, widget: RoundBigBlackKnob, grid: main, col: 2, row: hero}
  - {name: DRIVE_PARAM, grid: main, col: 3, row: flank}
  - {text: Res, grid: main, col: 1, y: 22.0}
  - {text: Freq, grid: main, col: 2, y: 19.2}
  - {text: Drive, grid: main, col: 3, y: 22.0}

  # Row 2 — attenuverters (Trimpot), one per column, unlabelled.
  - {name: RES_CV_PARAM, widget: Trimpot, grid: main, col: 1, row: atten}
  - {name: FREQ_CV_PARAM, widget: Trimpot, grid: main, col: 2, row: atten}
  - {name: DRIVE_CV_PARAM, widget: Trimpot, grid: main, col: 3, row: atten}

  # Row 3 — CV jacks, one per column, unlabelled (each column is named by
  # the knob label at the top of its stack).
  - {name: RES_INPUT, grid: main, col: 1, row: cv_jack}
  - {name: FREQ_INPUT, grid: main, col: 2, row: cv_jack}
  - {name: DRIVE_INPUT, grid: main, col: 3, row: cv_jack}

  # --- Below the amber cluster, on the bare panel ---
  # Two columns of three: In / Blend / Mix (left), HP / BP / LP (right).

  # Row 1 — In (stereo audio input, sharing one centered label) | HP
  # (stereo output). Blend's CV input sits alone in the gap to the left.
  - {name: BLEND_INPUT, x: 13.48, y: 86.75}
  - {name: AUDIO_INPUT, x: 20.55, y: 69.55}
  - {name: AUDIO_INPUT_R, kind: input, x: 30.25, y: 69.55}
  - {text: In, x: 25.4, y: 77.9}
  - {name: HP_OUTPUT, x: 32.45, y: 86.75}
  - {name: HP_OUTPUT_R, kind: output, x: 42.15, y: 86.75}
  - {text: HP, x: 37.3, y: 95.1}

  # Row 2 — Blend knob (regular size, LP/N/HP ring) | BP (stereo output).
  - {name: BLEND_PARAM, x: 13.496666666666664, y: 101.95}
  - {ring: [LP, N, HP], around: BLEND_PARAM}
  - {name: BP_OUTPUT, x: 32.44666666666666, y: 101.95}
  - {name: BP_OUTPUT_R, kind: output, x: 42.14666666666666, y: 101.95}
  - {text: BP, x: 37.29666666666666, y: 110.3}

  # Row 3 — Mix (stereo output) | LP (stereo output).
  - {name: MIX_OUTPUT, x: 8.65, y: 117.15}
  - {name: MIX_OUTPUT_R, kind: output, x: 18.35, y: 117.15}
  - {text: Mix, x: 13.5, y: 125.5}
  - {name: LP_OUTPUT, x: 32.45, y: 117.15}
  - {name: LP_OUTPUT_R, kind: output, x: 42.15, y: 117.15}
  - {text: LP, x: 37.3, y: 125.5}

# Vertical bars: each cluster column's knob -> attenuverter -> CV jack, plus
# Blend's lone CV input -> knob. Every #808080 bar in the reference SVG is an
# explicit pair here (v2 has no implicit-row connector model). BLEND_INPUT and
# BLEND_PARAM sit 0.0167mm apart on x (both exact per the shipped panel) —
# within the connector resolver's 0.1mm same-column tolerance; the bar itself
# stops short of the Blend ring's "N" label rather than running through it
# (the resolver's ring-avoidance clamp, ported from the panel's original
# design).
connectors:
  - [RES_PARAM, RES_CV_PARAM]
  - [RES_CV_PARAM, RES_INPUT]
  - [FREQ_PARAM, FREQ_CV_PARAM]
  - [FREQ_CV_PARAM, FREQ_INPUT]
  - [DRIVE_PARAM, DRIVE_CV_PARAM]
  - [DRIVE_CV_PARAM, DRIVE_INPUT]
  - [BLEND_INPUT, BLEND_PARAM]

# Wasp amber control zones: one behind the compressed knob cluster (stops
# just below the CV jacks), one behind the Blend/Mix/HP/BP/LP output group
# (In sits in the gap above it). The second zone extends past the panel
# bottom (128.5) so the visible bottom edge is square (rounded top corners
# only) — looks like it runs off the panel.
zones:
  - {x: 1.5, y: 15, w: 47.8, h: 48.1, fill: "#c99c1e", opacity: 0.73}
  - {x: 1.5, y: 80, w: 47.8, h: 50.5, fill: "#c99c1e", opacity: 0.73}
