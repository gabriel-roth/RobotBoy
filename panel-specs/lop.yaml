# Lop (display name Löp) — single-playhead lightweight Loooop. 12 HP, no
# group tints: one flat set of controls. Dark panel; screen up top, bleeding to
# 1.5mm from the panel edges; 3mm side margins; centered title. Three control
# rows under the screen, all four-column below row 1, every row center-aligned
# (labels on one line, control centers on one line, jacks on one line):
#   row 1: Speed / Pos / Jitter knob+cv stacks;
#   row 2: Trig and Jump jacks, then the Overdub mode button and Grid knob —
#          Grid mirrors Loooop's: a small 6-position snap knob
#          (Off/4/8/16/32/64) with its values printed close around it
#          (Ø = off); RoundSmallBlackSnapKnob is shared from src/loooop;
#   row 3: Size and D/W knob+cv stacks, then Clear and Record as stacked
#          button+trig groups (button over jack, tied by the connecting bar).
# Stereo In and Out pairs share the last row under single labels.
#
# metamodule/loooop/Lop_info.hh is HAND-MAINTAINED — regenerate only the SVG,
# then carry positions to the MetaModule header and the VCV display rect with:
#     python3 metamodule/loooop/sync_info_positions.py
# (header sync is delegated to ~/Dev/vcv-panel-gen/mm_sync.py --strict,
# name-matched through metamodule/loooop/sync-map-lop.yaml).
#
# The title is a baked vector wordmark (lop-logo.svg): "Löp" in Shuttleblock
# Demi, traced from ../Shuttleblock-Demi.png. The "Shuttleblock Test Demi" trial
# font installed on this machine has no U+00D6 (Ö) glyph, so the name can't be
# set as live text here — the logo carries the real letterforms instead.
# title_logo replaces the drawn title text; the logo is scaled to the title cap
# height at title_size and centered (nudge TITLE to fine-tune).
slug: Lop
name: LÖP
hp: 12
title_size: 9
side_margin: 3
title_valign: center
title_logo: lop-logo.svg
# A single neutral control zone, echoing Loooop's per-channel colored group
# tints: same vertical band (y=35.15, h=73.6) and 1.5mm edge inset, but white
# and unified since Löp has one flat control set (no channels to distinguish).
zones:
  - {x: 1.5, y: 35.15, w: 57.96, h: 73.6}
# The In/Out row drops to sit at the same height (cy 116.05) as Loooop's
# bottom In/Out jacks.
nudges:
  AUDIO_L_INPUT: [0, 2.65]
  OUT_L_OUTPUT: [0, 2.65]
rows:
  - type: screen
    height: 22.35
    bleed: true
    gap_above: 0.4
  - type: params
    gap_above: 3.6
    items:
      - {label: Speed,  name: SPEED_PARAM,    cv: SPEED_CV_INPUT}
      - {label: Pos,    name: POSITION_PARAM, cv: POSITION_CV_INPUT}
      - {label: Jitter, name: JITTER_PARAM,   cv: JITTER_CV_INPUT}
  # Column 3 borrows width from column 4 (weights 1.09/0.91, mirrored in the
  # row below to keep the columns aligned) so the OVERDUB label fits; columns
  # 1-2 keep their equal width.
  - type: params
    align: center
    gap_above: 2.0
    items:
      - {label: Trig,    name: TRIG_INPUT, type: inputs}
      - {label: Jump,    name: JUMP_INPUT, type: inputs}
      - {label: Overdub, name: OVERDUB_PARAM, control: button, weight: 1.09,
         widget: OverdubButton}
      - {label: Grid,    name: GRID_PARAM,    small: true, weight: 0.91,
         widget: RoundSmallBlackSnapKnob,
         values: ["Ø", "4", "8", "16", "32", "64"]}
  - type: params
    align: center
    gap_above: 2.0
    items:
      - {label: Size,   name: SIZE_PARAM,   cv: SIZE_CV_INPUT}
      - {label: D/W,    name: DRYWET_PARAM, cv: DRYWET_CV_INPUT}
      - {label: Clear,  name: CLEAR_PARAM,  control: button, weight: 1.09,
         trig: CLEAR_TRIG_INPUT}
      - {label: Record, name: RECORD_PARAM, control: button, weight: 0.91,
         trig: RECORD_TRIG_INPUT}
  - type: inputs
    gap_above: 1.3
    items:
      - {label: In,  name: AUDIO_L_INPUT, pair: AUDIO_R_INPUT}
      - {label: Out, name: OUT_L_OUTPUT,  pair: OUT_R_OUTPUT, type: outputs}
