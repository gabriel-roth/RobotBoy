# Lop (display name Löp) — single-playhead lightweight Loooop. 12 HP, no
# group tints: one flat set of controls. Dark panel; screen up top, bleeding to
# 1.5mm from the panel edges; 3mm side margins; centered title; CV under every
# knob. Row 2 is a four-column row: Size and D/W knob+cv stacks on the left,
# the Record and Clear buttons on the right (nudged down to sit just above their
# jacks and tied to them with a connecting bar, echoing the knob+cv stacks). The
# bottom control row is four trigger jacks — Trig, Jump, Record, Clear — labeled
# above; the Record/Clear jacks are unlabeled (label: "{blank}") since their
# names are carried by the buttons above them. Stereo In and Out pairs share the
# last row under single labels.
#
# metamodule/loooop/Lop_info.hh is HAND-MAINTAINED — regenerate only the SVG,
# then carry positions to the MetaModule header and the VCV display rect with:
#     python3 metamodule/loooop/sync_info_positions.py
# (header sync is delegated to ~/Dev/vcv-panel-gen/mm_sync.py --strict,
# name-matched through metamodule/loooop/sync-map-lop.yaml).
#
# The title is a baked vector wordmark (lop-logo.svg): "Löp" in Shuttleblock
# Demi, traced from ../Shuttleblock-Demi.png. The "Shuttleblock Test Demi" trial
# font installed on this machine has no U+00D6 (Ö) glyph, so the name can't be
# set as live text here — the logo carries the real letterforms instead.
# title_logo replaces the drawn title text; the logo is scaled to the title cap
# height at title_size and centered (nudge TITLE to fine-tune).
slug: Lop
name: LÖP
hp: 12
title_size: 9
side_margin: 3
title_valign: center
title_logo: lop-logo.svg
# A single neutral control zone, echoing Loooop's per-channel colored group
# tints: same vertical band (y=35.15, h=73.6) and 1.5mm edge inset, but white
# and unified since Löp has one flat control set (no channels to distinguish).
zones:
  - {x: 1.5, y: 35.15, w: 57.96, h: 73.6}
# Size/D-W knob+cv stacks fill row 2's left half; the Record/Clear buttons sit
# in the vacated right half. Drop the two buttons down (dy 17.7) so each sits a
# 2mm edge gap above its trigger jack in the bottom row — the same stack spacing
# as a knob over its cv — and connect them with the same bar (see connectors).
# The four-column grid already aligns each jack under its button. The In/Out row
# drops 1.65mm to sit at the same height (cy 116.05) as Loooop's bottom In/Out
# jacks.
nudges:
  RECORD_PARAM: [0, 17.7]
  CLEAR_PARAM: [0, 17.7]
  AUDIO_L_INPUT: [0, 1.65]
  OUT_L_OUTPUT: [0, 1.65]
# Tie each Record/Clear button to its trigger jack in the row below with the
# same connecting bar the knob+cv stacks use.
connectors:
  - [RECORD_PARAM, RECORD_TRIG_INPUT]
  - [CLEAR_PARAM, CLEAR_TRIG_INPUT]
rows:
  - type: screen
    height: 22.35
    bleed: true
    gap_above: 0.4
  - type: params
    gap_above: 3.6
    items:
      - {label: Speed,  name: SPEED_PARAM,    cv: SPEED_CV_INPUT}
      - {label: Pos,    name: POSITION_PARAM, cv: POSITION_CV_INPUT}
      - {label: Jitter, name: JITTER_PARAM,   cv: JITTER_CV_INPUT}
  - type: params
    gap_above: 2.0
    items:
      - {label: Size,   name: SIZE_PARAM,   cv: SIZE_CV_INPUT}
      - {label: D/W,    name: DRYWET_PARAM, cv: DRYWET_CV_INPUT}
      - {label: Record, name: RECORD_PARAM, control: button}
      - {label: Clear,  name: CLEAR_PARAM,  control: button}
  - type: inputs
    gap_above: 2.0
    label_side: above
    items:
      - {label: Trig,      name: TRIG_INPUT}
      - {label: Jump,      name: JUMP_INPUT}
      - {label: "{blank}", name: RECORD_TRIG_INPUT}
      - {label: "{blank}", name: CLEAR_TRIG_INPUT}
  - type: inputs
    gap_above: 1.3
    items:
      - {label: In,  name: AUDIO_L_INPUT, pair: AUDIO_R_INPUT}
      - {label: Out, name: OUT_L_OUTPUT,  pair: OUT_R_OUTPUT, type: outputs}
