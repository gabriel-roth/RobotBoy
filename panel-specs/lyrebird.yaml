# Lyrebird (gesture/CV recorder, shape modulator family).
# TIME (SYNC/FREE) and PLAY (LOOP/ONCE) are CKSS switches, lever up = SYNC / LOOP (value 1).
# A cable in CV IN records CV instead of GESTURE. No LENGTH readout: the display's footer shows LENGTH and BPM.
# FILE_PREV_INPUT / FILE_NEXT_INPUT: a trigger steps to the previous / next file, as the
# button above each jack does.
#
# 21 HP, two columns, plates in the Skylark/Weaver style, 1.5 mm from the panel edges, 2.0 mm
# between them. Both columns split at the same gap (100.86-102.86).
#  - Title flush left with the display, tracking halfway between Weaver's and Skylark's (3.182), centered in the 17 mm band.
#  - Left column (1.5-64.38), two columns inside (19.775 / 46.107, from RECORD's and PUNCH's
#    units, gap-equalized 10.22), each item centered on its column, labels above:
#    - Display (4:3, 62.88 x 47.16, 17-64.16).
#    - PERFORM plate, sage (#8a9a83 at 55%; magenta's muted complement), 66.16-100.86, rows and
#      margins evenly spaced (2.7):
#      - Bottom row: RECORD and PUNCH, each a lit button with its gate jack beside (8.5 apart,
#        one label above the pair), then the TIME switch. Three equal gaps (6.65) from the plate's
#        left edge to the switch's label column (x 56.68, which mirrors PLAY about the plate gap):
#        RECORD 11.75 / 20.25 (label 16.0), PUNCH 34.515 / 43.015 (label 38.765). Labels 87.45,
#        controls 94.15.
#      - Top row follows the bottom row's columns: CLOCK (BPM knob + jack, 10.5 apart, label
#        16.0) and LENGTH (snapped knob, 38.765); labels 71.16, controls 77.66.
#      - TIME switch (x 56.68) centred vertically on the plate (83.51), spanning both rows. SYNC
#        above, FREE below (2.5): SYNC's cap top level with TRIG's (75.571), so baselines 77.474 and
#        91.449, 2.54 between each word and the switch.
#      - REC plate name (Futura 5.0, #545c52: 18% darker than the plate over the panel), bottom-right:
#        ink 1.3 above the plate bottom (baseline 99.56) and 2.2 in from its right edge (x 57.776,
#        the text centre; ink right edge 62.18). Round 8 card 03 of local/panel-mockups/lyrebird-modes/.
#    - SOURCE plate, plain opaque magenta #b8466a, 102.86-123: GESTURE (big knob, the knob you
#      record) and CV IN, the two sources, side by side on the plate's centre line (112.93), 16
#      apart, the pair centred on the plate (32.94): knob 26.74, jack 42.74. The display's
#      punch-in trace is the brighter #ff5f95 (mock-lyrebird.py).
#      - IN plate name (as REC, #973957: 18% darker than the plate), top-right, mirroring REC
#        across the plate gap: cap top 1.3 below the plate top (baseline 108.0), ink right edge
#        62.18 (x 59.784). local/panel-mockups/lyrebird-io/ round 4 card 01.
#  - Signal-flow arrows (Brume's style, zone defaults 3.0 x 1.4): SOURCE up into PERFORM (over
#    the knob/jack pair's midpoint, x 34.74), PERFORM across into PLAYBACK, PLAYBACK down into the
#    output plate (those two centered on their edge).
#  - Right column (66.38-105.18): as narrow as two 13.4 label-width columns (77.08 / 94.48)
#    with 4.0 gaps.
#    - PLAYBACK plate (17-100.86), labels above, blocks and margins evenly spaced (4.23):
#      - FILE: previous and next on the two columns, each over its trigger jack (10 apart,
#        connector), SAVE between them (no jack), chevrons outside; label 23.53, buttons
#        28.28, jacks 38.28.
#      - SPEED and SMOOTH: knob over CV jack (12 apart, connector); labels 48.82, knobs 55.32,
#        jacks 67.32.
#      - Bottom row in three columns 74.08 / 85.78 / 97.48 (gaps equal for three jacks): the PLAY
#        switch (LOOP above, ONCE below, same heights as TIME), then TRIG and REVERSE, button over
#        gate jack (10 apart, connector); labels 77.86, buttons 82.61, jacks 92.61.
#      - PLAY plate name (as REC, #505e67), bottom-left: ink 1.3 above the plate bottom and 2.2 in
#        from its left edge (x 73.939; ink left edge 68.58).
#    - Output plate (102.86-123): EOC and OUT (in a white ring) 4.5 apart, the ring's right edge
#      2.88 in from the plate (as the GESTURE knob's old margin): EOC 83.085, OUT 96.95; the ring
#      and labels centered vertically (2.9 above the ring); controls 111.11, labels 120.11.
#      - OUT plate name (as PLAY, #5c5c5c), top-left, mirroring PLAY across the plate gap:
#        baseline 108.0 (as IN), ink left edge 68.58 (x 73.603).
slug: Lyrebird
name: LYREBIRD
hp: 21

title:
  size: 9.5
  tracking: 3.182
  # Ink's left edge at 1.5 (title_fit.py LYREBIRD 9.5 3.182 1.5).
  x: 36.995
  dy: 2.75

theme:
  # Softer than the white labels: white at 88% over the #3d3d3d panel, as a flat color.
  title_color: "#e8e8e8"

zones:
  # Display background.
  - {x: 1.5, y: 17.0, w: 62.88, h: 47.16, rx: 2, fill: "#0c0e10", opacity: 1.0}
  # PERFORM plate.
  - {x: 1.5, y: 66.16, w: 62.88, h: 34.70, rx: 2, fill: "#8a9a83", opacity: 0.55,
     arrows: [{side: right, at: 83.51}]}
  # SOURCE plate.
  - {x: 1.5, y: 102.86, w: 62.88, h: 20.14, rx: 2, fill: "#b8466a", opacity: 1.0,
     arrows: [{side: top, at: 34.74}]}
  # PLAYBACK plate.
  - {x: 66.38, y: 17.0, w: 38.8, h: 83.86, rx: 2, fill: "#7f9fb3", opacity: 0.55,
     arrows: [{side: bottom, at: 85.78}]}
  # Output plate.
  - {x: 66.38, y: 102.86, w: 38.8, h: 20.14, rx: 2, fill: "#9a9a9a", opacity: 0.55}
  # OUT ring, as on Skylark and Weaver.
  - {x: 91.6, y: 105.755, w: 10.70, h: 10.70, rx: 5.35, fill: "#ffffff", opacity: 1.0}
  - {x: 92.35, y: 106.505, w: 9.20, h: 9.20, rx: 4.60, fill: "#707070", opacity: 1.0}

elements:
  - {name: SCREEN, kind: widget, rect: {x: 1.5, y: 17.0, w: 62.88, h: 47.16}}

  # --- PERFORM plate.
  - {text: CLOCK, x: 16.0, y: 71.16}
  - {name: BPM_PARAM, x: 10.75, y: 77.66}
  - {name: CLOCK_INPUT, x: 21.25, y: 77.66}
  - {text: LENGTH, x: 38.765, y: 71.16}
  - {name: LENGTH_PARAM, widget: RoundBlackSnapKnob, x: 38.765, y: 77.66}
  - {text: RECORD, x: 16.0, y: 87.45}
  - {name: RECORD_PARAM, widget: VCVBezel, x: 11.75, y: 94.15}
  - {name: RECORD_INPUT, x: 20.25, y: 94.15}
  - {text: PUNCH, x: 38.765, y: 87.45}
  - {name: PUNCH_PARAM, widget: VCVBezel, x: 34.515, y: 94.15}
  - {name: PUNCH_INPUT, x: 43.015, y: 94.15}
  - {text: SYNC, x: 56.68, y: 77.474, size: 2.5}
  - {name: TIME_PARAM, widget: CKSS, x: 56.68, y: 83.51}
  - {text: FREE, x: 56.68, y: 91.449, size: 2.5}
  - {text: REC, x: 57.776, y: 99.56, size: 5.0, color: "#545c52"}

  # --- SOURCE plate.
  - {name: GESTURE_PARAM, widget: RoundBigBlackKnob, x: 26.74, y: 112.93}
  - {name: CV_INPUT, x: 42.74, y: 112.93}
  - {text: IN, x: 59.784, y: 108.0, size: 5.0, color: "#973957"}

  # --- PLAYBACK plate.
  - {text: FILE, x: 85.78, y: 23.525}
  - {name: FILE_PREV_PARAM, widget: TL1105, x: 77.08, y: 28.275}
  - {name: SAVE_PARAM, widget: VCVButton, x: 85.78, y: 28.275}
  - {name: FILE_NEXT_PARAM, widget: TL1105, x: 94.48, y: 28.275}
  - {name: FILE_PREV_INPUT, x: 77.08, y: 38.275}
  - {name: FILE_NEXT_INPUT, x: 94.48, y: 38.275}
  - row: {grid: playback, at: labels}
    place: [SPEED, SMOOTH]
  - row: {grid: playback, at: knobs}
    place: [{name: SPEED_PARAM}, {name: SMOOTH_PARAM}]
  - row: {grid: playback, at: cv}
    place: [{name: SPEED_INPUT}, {name: SMOOTH_INPUT}]
  - row: {grid: bottom, at: btn_labels}
    place: [~, TRIG, REVERSE]
  - row: {grid: bottom, at: buttons, widget: VCVButton}
    place: [~, {name: TRIG_PARAM}, {name: REVERSE_PARAM}]
  - row: {grid: bottom, at: gates}
    place: [~, {name: TRIG_INPUT}, {name: REVERSE_INPUT}]
  - {text: LOOP, grid: bottom, col: 1, y: 77.474, size: 2.5}
  - {name: PLAY_PARAM, widget: CKSS, grid: bottom, col: 1, y: 83.51}
  - {text: ONCE, grid: bottom, col: 1, y: 91.449, size: 2.5}
  - {text: PLAY, x: 73.939, y: 99.56, size: 5.0, color: "#505e67"}

  # --- Output plate.
  - {name: EOC_OUTPUT, x: 83.085, y: 111.105}
  - {text: EOC, x: 83.085, y: 120.105, size: 3.175}
  - {name: MAIN_OUTPUT, x: 96.95, y: 111.105}
  - {text: OUT, x: 96.95, y: 120.105, size: 3.175}
  - {text: OUT, x: 73.603, y: 108.0, size: 5.0, color: "#5c5c5c"}

grids:
  playback:
    cols: [77.08, 94.48]
    rows:
      labels: 48.815
      knobs: 55.315
      cv: 67.315
  # PLAYBACK's bottom row: the PLAY switch, TRIG and REVERSE, gaps equal for three jacks
  # ((38.8 - 3 x 8.03) / 4 = 3.68)
  bottom:
    cols: [74.08, 85.78, 97.48]
    rows:
      btn_labels: 77.855
      buttons: 82.605
      gates: 92.605

connectors:
  - [FILE_PREV_PARAM, FILE_PREV_INPUT]
  - [FILE_NEXT_PARAM, FILE_NEXT_INPUT]
  - [SPEED_PARAM, SPEED_INPUT]
  - [SMOOTH_PARAM, SMOOTH_INPUT]
  - [TRIG_PARAM, TRIG_INPUT]
  - [REVERSE_PARAM, REVERSE_INPUT]

glyphs:
  - {src: glyphs/weaver/step-back.svg,    at: [72.58, 28.275]}
  - {src: glyphs/weaver/step-forward.svg, at: [98.98, 28.275]}
