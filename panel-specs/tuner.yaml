# Tuner panel spec (vcv-panel-gen): SKETCH, not yet generated into res/Tuner.svg.
# res/Tuner.svg and res/Tuner-dark.svg are still CV Funk's dual-tuner panels.
#
# Single-channel version of the CV Funk Tuner: two windows, the audio input,
# the V/oct output and OUT, a copy of the input for patching the tuner inline.
# CV Funk's scope knobs (OFFSET, GAIN, WIDTH) are gone.
# Positions are sketch-grade (nearest half millimetre); the layout is being
# chosen in design rounds (local/panel-mockups/tuner/).
#
# 12 HP, in the Lucarne layout: title in the top band, then two 4:3 windows on
# the bare panel (54 x 40.5, centered: (60.96 - 54) / 2 = 3.48, 2.0 apart):
# SCREEN, the readout (note, cents, meter, Hz), over SCOPE, the waveform.
# 4:3 is the MetaModule full-screen shape.
#  - Jack plate (1.5-59.46, 101.5-121), 1.5 mm from the panel edges: IN,
#    V/OCT, OUT in three equal columns (plate width / 6 from each edge, then
#    / 3 apart: 11.16 / 30.48 / 49.8), jacks at 109, labels below at 117.5.
slug: Tuner
name: TUNER
hp: 12

theme:
  title_color: "#e8e8e8"  # softer than the white labels, as on the other panels

title:
  size: 6.35
  tracking: 0.661458
  dy: 1.211

zones:
  - {x: 1.5, y: 101.5, w: 57.96, h: 19.5, rx: 2, fill: "#7f9fb3", opacity: 0.55}

elements:
  - {name: SCREEN, kind: widget, rect: {x: 3.48, y: 14, w: 54, h: 40.5}}
  - {name: SCOPE, kind: widget, rect: {x: 3.48, y: 56.5, w: 54, h: 40.5}}

  - {name: AUDIO_INPUT, x: 11.16, y: 109.0}
  - {text: IN, x: 11.16, y: 117.5}
  - {name: FREQ_OUTPUT, x: 30.48, y: 109.0}
  - {text: V/OCT, x: 30.48, y: 117.5}
  - {name: AUDIO_OUTPUT, x: 49.8, y: 109.0}
  - {text: OUT, x: 49.8, y: 117.5}
